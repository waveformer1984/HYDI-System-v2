<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Forge - Revenue Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.5); }
            50% { box-shadow: 0 0 40px rgba(34, 197, 94, 0.8); }
        }
        .revenue-active { animation: pulse-glow 2s infinite; }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-8">
            <h1 class="text-4xl font-bold text-center mb-2">The Forge Revenue Dashboard</h1>
            <p class="text-center text-gray-400">Real-time SaaS Performance Metrics</p>
            <div class="text-center mt-4">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-500 text-white revenue-active">
                    Revenue Engine Active
                </span>
            </div>
        </header>

        <!-- Key Metrics -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <div class="text-3xl font-bold text-green-400" id="totalLeads">0</div>
                <div class="text-gray-400 text-sm">Total Leads</div>
            </div>
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <div class="text-3xl font-bold text-blue-400" id="welcomeRate">0%</div>
                <div class="text-gray-400 text-sm">Welcome Rate</div>
            </div>
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <div class="text-3xl font-bold text-purple-400" id="cpuUsage">0%</div>
                <div class="text-gray-400 text-sm">CPU Usage</div>
            </div>
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <div class="text-3xl font-bold text-yellow-400" id="revenueProjection">$0</div>
                <div class="text-gray-400 text-sm">Daily Revenue</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <h3 class="text-xl font-semibold mb-4">Lead Generation Trend</h3>
                <canvas id="leadsChart"></canvas>
            </div>
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <h3 class="text-xl font-semibold mb-4">System Performance</h3>
                <canvas id="performanceChart"></canvas>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
            <h3 class="text-xl font-semibold mb-4">Recent Activity</h3>
            <div id="activityFeed" class="space-y-2">
                <div class="text-gray-400">Loading recent activity...</div>
            </div>
        </div>

        <!-- Top Services -->
        <div class="bg-gray-800 rounded-lg p-6 border border-gray-700 mt-6">
            <h3 class="text-xl font-semibold mb-4">Top Service Interests</h3>
            <div id="topServices" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="text-gray-400">Loading service interests...</div>
            </div>
        </div>
    </div>

    <script>
        // Supabase configuration
        const supabaseUrl = 'https://wufhlhrbskacneneylqa.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrYm5mb3ZqZGNvYmlmZXVwdmJuIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3MDU2Njg3MCwiZXhwIjoyMDg2MTQyODcwfQ.Z51YOVK9AmcwghphIaKX6vFUSZaYYS05YxfxLQNFXVE';
        
        // Initialize Supabase client
        const { createClient } = window.supabase || {};
        let supabase;
        
        if (createClient) {
            supabase = createClient(supabaseUrl, supabaseKey);
        } else {
            // Fallback for demo
            console.log('Supabase client not available - using demo data');
        }

        // Chart instances
        let leadsChart, performanceChart;

        // Initialize dashboard
        async function initDashboard() {
            initCharts();
            await loadMetrics();
            await loadRecentActivity();
            await loadTopServices();
            
            // Refresh every 30 seconds
            setInterval(() => {
                loadMetrics();
                loadRecentActivity();
                loadTopServices();
            }, 30000);
        }

        // Initialize charts
        function initCharts() {
            // Leads Chart
            const leadsCtx = document.getElementById('leadsChart').getContext('2d');
            leadsChart = new Chart(leadsCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Leads Generated',
                        data: [],
                        borderColor: 'rgb(34, 197, 94)',
                        backgroundColor: 'rgba(34, 197, 94, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });

            // Performance Chart
            const performanceCtx = document.getElementById('performanceChart').getContext('2d');
            performanceChart = new Chart(performanceCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'CPU Usage (%)',
                        data: [],
                        borderColor: 'rgb(59, 130, 246)',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true, max: 100 }
                    }
                }
            });
        }

        // Load metrics
        async function loadMetrics() {
            if (!supabase) return;

            try {
                // Load leads
                const { data: leads, error: leadsError } = await supabase
                    .from('leads')
                    .select('*');
                
                if (!leadsError && leads) {
                    const totalLeads = leads.length;
                    const welcomedLeads = leads.filter(l => l.welcome_sent).length;
                    const welcomeRate = totalLeads > 0 ? ((welcomedLeads / totalLeads) * 100).toFixed(1) : 0;
                    
                    document.getElementById('totalLeads').textContent = totalLeads;
                    document.getElementById('welcomeRate').textContent = `${welcomeRate}%`;
                    
                    // Update revenue projection
                    const dailyProjection = totalLeads * 0.15 * 49;
                    document.getElementById('revenueProjection').textContent = `$${dailyProjection.toFixed(0)}`;
                }

                // Load system status
                const { data: status, error: statusError } = await supabase
                    .from('system_status')
                    .select('*')
                    .order('last_broadcast', { ascending: false })
                    .limit(1);
                
                if (!statusError && status && status.length > 0) {
                    document.getElementById('cpuUsage').textContent = `${status[0].cpu_usage || 0}%`;
                }

            } catch (err) {
                console.error('Failed to load metrics:', err);
            }
        }

        // Load recent activity
        async function loadRecentActivity() {
            if (!supabase) return;

            try {
                const { data: memory, error } = await supabase
                    .from('heidi_memory')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(5);
                
                const activityFeed = document.getElementById('activityFeed');
                
                if (!error && memory && memory.length > 0) {
                    activityFeed.innerHTML = memory.map(mem => `
                        <div class="flex justify-between items-center p-3 bg-gray-700 rounded">
                            <div>
                                <div class="font-medium">${mem.user_email}</div>
                                <div class="text-sm text-gray-400">${mem.last_interaction_type}</div>
                            </div>
                            <div class="text-sm text-gray-400">
                                ${new Date(mem.created_at).toLocaleTimeString()}
                            </div>
                        </div>
                    `).join('');
                } else {
                    activityFeed.innerHTML = '<div class="text-gray-400">No recent activity</div>';
                }
            } catch (err) {
                console.error('Failed to load activity:', err);
            }
        }

        // Load top services
        async function loadTopServices() {
            if (!supabase) return;

            try {
                const { data: leads, error } = await supabase
                    .from('leads')
                    .select('metadata');
                
                const topServices = document.getElementById('topServices');
                
                if (!error && leads && leads.length > 0) {
                    const interests = {};
                    
                    leads.forEach(lead => {
                        if (lead.metadata?.interests) {
                            lead.metadata.interests.forEach(interest => {
                                interests[interest] = (interests[interest] || 0) + 1;
                            });
                        }
                    });
                    
                    const sorted = Object.entries(interests)
                        .sort(([,a], [,b]) => b - a)
                        .slice(0, 3);
                    
                    if (sorted.length > 0) {
                        topServices.innerHTML = sorted.map(([service, count]) => `
                            <div class="bg-gray-700 p-4 rounded">
                                <div class="font-medium">${service}</div>
                                <div class="text-sm text-gray-400">${count} interested</div>
                            </div>
                        `).join('');
                    } else {
                        topServices.innerHTML = '<div class="text-gray-400">No service interests yet</div>';
                    }
                } else {
                    topServices.innerHTML = '<div class="text-gray-400">No service interests yet</div>';
                }
            } catch (err) {
                console.error('Failed to load top services:', err);
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
    
    <!-- Load Supabase client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
