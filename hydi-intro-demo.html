<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HYDI — Local Intro</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e; --accent:#e3b341; --ok:#3fb950; --bad:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; font-size:17px; }
  header { display:flex; align-items:center; gap:14px; padding:18px 26px; border-bottom:1px solid var(--border); background:var(--panel); }
  .logo { width:40px; height:40px; border-radius:10px; background:var(--accent); color:#000; font-weight:800; font-size:22px; display:flex; align-items:center; justify-content:center; }
  h1 { font-size:20px; margin:0; }
  .sub { color:var(--dim); font-size:14px; }
  #status { margin-left:auto; display:flex; gap:16px; font-size:14px; }
  .pill { padding:5px 12px; border-radius:999px; border:1px solid var(--border); background:#0d1117; }
  .pill b.ok { color:var(--ok); } .pill b.bad { color:var(--bad); }
  main { max-width:900px; margin:0 auto; padding:24px 26px 140px; }
  .msg { display:flex; gap:12px; margin:18px 0; }
  .avatar { flex:0 0 36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; }
  .msg.user .avatar { background:#1f6feb; color:#fff; }
  .msg.heidi .avatar { background:var(--accent); color:#000; }
  .bubble { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 16px; white-space:pre-wrap; line-height:1.5; flex:1; }
  .meta { color:var(--dim); font-size:12.5px; margin-top:8px; }
  .sys { text-align:center; color:var(--dim); font-size:14px; margin:14px 0; }
  .thinking { color:var(--accent); }
  footer { position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--border); padding:14px 26px; }
  .row { max-width:900px; margin:0 auto; display:flex; gap:10px; }
  input { flex:1; background:#0d1117; border:1px solid var(--border); border-radius:10px; color:var(--text); padding:12px 14px; font-size:16px; }
  button { background:var(--accent); color:#000; border:0; border-radius:10px; padding:12px 22px; font-size:16px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <div class="logo">H</div>
  <div><h1>HYDI — Heidi Core</h1><div class="sub">Local-only intro · Ollama on this machine · nothing leaves your computer</div></div>
  <div id="status">
    <span class="pill">Server <b id="st-server">…</b></span>
    <span class="pill">Brain <b id="st-brain">…</b></span>
    <span class="pill">Model <b id="st-model">…</b></span>
  </div>
</header>
<main id="log"></main>
<footer><div class="row">
  <input id="box" placeholder="Type your own message to Heidi…" onkeydown="if(event.key==='Enter')send()">
  <button id="btn" onclick="send()">Send</button>
</div></footer>
<script>
const API = 'http://localhost:3456';
const log = document.getElementById('log');

function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
function sys(text, cls=''){ log.appendChild(el(`<div class="sys ${cls}">${text}</div>`)); scroll(); }
function msg(who, text, meta){
  const m = el(`<div class="msg ${who}"><div class="avatar">${who==='user'?'J':'H'}</div><div class="bubble"></div></div>`);
  m.querySelector('.bubble').textContent = text;
  if (meta) m.querySelector('.bubble').appendChild(el(`<div class="meta">${meta}</div>`));
  log.appendChild(m); scroll(); return m;
}
function scroll(){ window.scrollTo(0, document.body.scrollHeight); }

async function health(){
  try {
    const r = await fetch(API+'/health'); const h = await r.json();
    document.getElementById('st-server').textContent = 'online'; document.getElementById('st-server').className='ok';
    document.getElementById('st-brain').textContent = h.brain; document.getElementById('st-brain').className = h.brain==='connected'?'ok':'bad';
    const s = await (await fetch(API+'/state')).json();
    document.getElementById('st-model').textContent = s.brain?.model || '?'; document.getElementById('st-model').className='ok';
    return true;
  } catch(e) {
    document.getElementById('st-server').textContent = 'offline'; document.getElementById('st-server').className='bad';
    sys('Cannot reach Heidi at localhost:3456 — is start-hydi-local.bat running?', 'thinking');
    return false;
  }
}

async function ask(text){
  msg('user', text);
  const t = msg('heidi', '…thinking (local model, give it a moment)…');
  const t0 = Date.now();
  try {
    const r = await fetch(API+'/think', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ input:text, options:{ maxTokens:250 } })
    });
    const d = await r.json();
    t.querySelector('.bubble').textContent = d.response || d.error || '(no response)';
    t.querySelector('.bubble').appendChild(el(`<div class="meta">${d.model||''} · ${((Date.now()-t0)/1000).toFixed(1)}s · confidence ${(d.confidence??0).toFixed(2)}</div>`));
  } catch(e) {
    t.querySelector('.bubble').textContent = 'Error: ' + e.message;
  }
  scroll();
}

let busy = false;
async function send(){
  if (busy) return;
  const box = document.getElementById('box');
  const v = box.value.trim(); if (!v) return;
  box.value=''; busy=true; document.getElementById('btn').disabled=true;
  await ask(v);
  busy=false; document.getElementById('btn').disabled=false;
}

(async () => {
  sys('HYDI local intro — connecting to Heidi Core on this machine…');
  if (!(await health())) return;
  sys('Connected. Running scripted intro — then the keyboard is yours.');
  busy=true; document.getElementById('btn').disabled=true;
  await ask("Hi Heidi — you're now running 100% locally on J's machine via Ollama, no cloud services. Introduce yourself to J in 2–3 sentences.");
  await ask('Briefly: what can you help with day to day, and what happens to memory of this conversation?');
  busy=false; document.getElementById('btn').disabled=false;
  sys('Intro complete — type below to keep talking to Heidi.');
})();
</script>
</body>
</html>
