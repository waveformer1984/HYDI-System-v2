<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProtoForge Command Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: rgba(26, 26, 62, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: rgba(15, 15, 35, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header h1 {
            font-size: 18px;
            color: #64ffda;
            margin-bottom: 5px;
        }

        .sidebar-header .subtitle {
            font-size: 12px;
            color: #8892b0;
        }

        /* System Selector */
        .system-selector {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .system-selector h3 {
            font-size: 14px;
            color: #64ffda;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .system-button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid rgba(100, 255, 218, 0.3);
            color: #64ffda;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .system-button:hover {
            background: rgba(100, 255, 218, 0.2);
            transform: translateX(5px);
        }

        .system-button.active {
            background: rgba(100, 255, 218, 0.3);
            border-color: #64ffda;
            box-shadow: 0 0 10px rgba(100, 255, 218, 0.5);
        }

        /* Connection Status */
        .connection-status {
            padding: 20px;
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #64ffda;
        }

        .status-dot.disconnected {
            background: #ff6b6b;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Main Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            background: rgba(15, 15, 35, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-system {
            font-size: 20px;
            color: #64ffda;
        }

        .system-info {
            font-size: 12px;
            color: #8892b0;
        }

        /* Messages Container */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: rgba(100, 255, 218, 0.2);
            border: 1px solid rgba(100, 255, 218, 0.3);
        }

        .message.system {
            align-self: flex-start;
            background: rgba(136, 146, 176, 0.1);
            border: 1px solid rgba(136, 146, 176, 0.3);
        }

        .message.error {
            align-self: flex-start;
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .message Heidi {
            background: rgba(255, 107, 255, 0.1);
            border: 1px solid rgba(255, 107, 255, 0.3);
        }

        .message CASCADE {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .message KILO {
            background: rgba(0, 123, 255, 0.1);
            border: 1px solid rgba(0, 123, 255, 0.3);
        }

        .message-header {
            font-size: 12px;
            color: #8892b0;
            margin-bottom: 5px;
        }

        .message-content {
            font-size: 14px;
            line-height: 1.5;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background: rgba(15, 15, 35, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            background: rgba(26, 26, 62, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }

        .message-input:focus {
            border-color: #64ffda;
            box-shadow: 0 0 5px rgba(100, 255, 218, 0.3);
        }

        .send-button {
            padding: 12px 24px;
            background: rgba(100, 255, 218, 0.2);
            border: 1px solid rgba(100, 255, 218, 0.3);
            color: #64ffda;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .send-button:hover {
            background: rgba(100, 255, 218, 0.3);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Quick Commands */
        .quick-commands {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .quick-command {
            padding: 5px 10px;
            background: rgba(136, 146, 176, 0.1);
            border: 1px solid rgba(136, 146, 176, 0.3);
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-command:hover {
            background: rgba(136, 146, 176, 0.2);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(26, 26, 62, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(136, 146, 176, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(136, 146, 176, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>ProtoForge Portal</h1>
                <div class="subtitle">System Command Interface</div>
            </div>

            <div class="system-selector">
                <h3>Systems</h3>
                <button class="system-button active" data-system="ursula">🔮 Ursula</button>
                <button class="system-button" data-system="heidi">🧠 Heidi</button>
                <button class="system-button" data-system="cascade">⚡ CASCADE</button>
                <button class="system-button" data-system="kilo">🔧 KILO</button>
                <button class="system-button" data-system="protoforge">🌐 ProtoForge</button>
                <button class="system-button" data-system="hyve">🐝 Hyve</button>
                <button class="system-button" data-system="infrastructure">🏗️ Infrastructure</button>
            </div>

            <div class="connection-status">
                <div class="status-indicator">
                    <div class="status-dot disconnected" id="statusDot"></div>
                    <span id="statusText">Disconnected</span>
                </div>
                <div style="font-size: 12px; color: #8892b0;">
                    <div>Messages: <span id="messageCount">0</span></div>
                    <div>Uptime: <span id="uptime">0:00</span></div>
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <div>
                    <div class="current-system" id="currentSystem">Ursula</div>
                    <div class="system-info" id="systemInfo">Event Stream Manager</div>
                </div>
                <div style="font-size: 12px; color: #8892b0;">
                    <div id="currentTime"></div>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <!-- Messages will appear here -->
            </div>

            <div class="input-area">
                <div class="input-container">
                    <input 
                        type="text" 
                        class="message-input" 
                        id="messageInput" 
                        placeholder="Type your command or message..."
                        onkeypress="handleKeyPress(event)"
                    >
                    <button class="send-button" id="sendButton" onclick="sendMessage()">
                        Send
                    </button>
                </div>
                <div class="quick-commands">
                    <div class="quick-command" onclick="sendQuickCommand('status')">status</div>
                    <div class="quick-command" onclick="sendQuickCommand('help')">help</div>
                    <div class="quick-command" onclick="sendQuickCommand('events')">events</div>
                    <div class="quick-command" onclick="sendQuickCommand('health')">health</div>
                    <div class="quick-command" onclick="sendQuickCommand('metrics')">metrics</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // System configuration
        const systems = {
            ursula: {
                name: 'Ursula',
                description: 'Event Stream Manager',
                endpoint: '/events/stream',
                wsEndpoint: null, // Will be set based on current location
                color: '#64ffda'
            },
            heidi: {
                name: 'Heidi',
                description: 'Contextual Conscience',
                endpoint: '/api/heidi/chat',
                wsEndpoint: null,
                color: '#ff6bff'
            },
            cascade: {
                name: 'CASCADE',
                description: 'Event Processing System',
                endpoint: '/api/cascade/chat',
                wsEndpoint: null,
                color: '#ffc107'
            },
            kilo: {
                name: 'KILO',
                description: 'Repair Hypothesis Engine',
                endpoint: '/api/kilo/chat',
                wsEndpoint: null,
                color: '#007bff'
            },
            protoforge: {
                name: 'ProtoForge',
                description: 'Core System',
                endpoint: '/api/protoforge/chat',
                wsEndpoint: null,
                color: '#28a745'
            },
            hyve: {
                name: 'Hyve',
                description: 'Opportunity Collective',
                endpoint: '/api/hyve/chat',
                wsEndpoint: null,
                color: '#fd7e14'
            },
            infrastructure: {
                name: 'Infrastructure',
                description: 'System Health Monitor',
                endpoint: '/api/infrastructure/chat',
                wsEndpoint: null,
                color: '#6f42c1'
            }
        };

        // State
        let currentSystem = 'ursula';
        let websocket = null;
        let messageCount = 0;
        let startTime = Date.now();

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initializeSystem();
            updateTime();
            setInterval(updateTime, 1000);
            setInterval(updateUptime, 1000);
        });

        function initializeSystem() {
            // Set up WebSocket endpoints based on current location
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsHost = window.location.host;
            
            Object.keys(systems).forEach(key => {
                systems[key].wsEndpoint = `${wsProtocol}//${wsHost}/api/${key}/ws`;
            });

            // Add event listeners to system buttons
            document.querySelectorAll('.system-button').forEach(button => {
                button.addEventListener('click', () => {
                    selectSystem(button.dataset.system);
                });
            });

            // Connect to initial system
            connectToSystem(currentSystem);
        }

        function selectSystem(systemName) {
            // Update UI
            document.querySelectorAll('.system-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-system="${systemName}"]`).classList.add('active');

            // Update header
            document.getElementById('currentSystem').textContent = systems[systemName].name;
            document.getElementById('systemInfo').textContent = systems[systemName].description;

            // Disconnect from current and connect to new
            if (websocket) {
                websocket.close();
            }
            currentSystem = systemName;
            connectToSystem(systemName);

            // Add system message
            addMessage('system', `Switched to ${systems[systemName].name}`, 'system');
        }

        function connectToSystem(systemName) {
            const system = systems[systemName];
            
            // Update status
            updateStatus('Connecting...', 'disconnected');

            // Create WebSocket connection
            try {
                websocket = new WebSocket(system.wsEndpoint);

                websocket.onopen = () => {
                    updateStatus('Connected', 'connected');
                    addMessage('system', `Connected to ${system.name}`, 'system');
                };

                websocket.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleMessage(data);
                    } catch (e) {
                        addMessage(systemName, event.data, 'system');
                    }
                };

                websocket.onerror = (error) => {
                    updateStatus('Connection Error', 'disconnected');
                    addMessage('error', `Connection error: ${error}`, 'error');
                };

                websocket.onclose = () => {
                    updateStatus('Disconnected', 'disconnected');
                    // Attempt to reconnect after 3 seconds
                    setTimeout(() => {
                        if (currentSystem === systemName) {
                            connectToSystem(systemName);
                        }
                    }, 3000);
                };

            } catch (error) {
                updateStatus('Connection Failed', 'disconnected');
                addMessage('error', `Failed to connect: ${error.message}`, 'error');
                
                // Fallback to HTTP polling
                startHttpPolling(systemName);
            }
        }

        function startHttpPolling(systemName) {
            const system = systems[systemName];
            
            // Simulate connection via HTTP
            updateStatus('HTTP Mode', 'connected');
            addMessage('system', `Using HTTP mode for ${system.name}`, 'system');
        }

        function handleMessage(data) {
            const { type, message, sender, timestamp } = data;
            
            if (type === 'message') {
                addMessage(sender || currentSystem, message, sender);
            } else if (type === 'status') {
                addMessage('system', message, 'system');
            } else if (type === 'error') {
                addMessage('error', message, 'error');
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;

            // Add user message
            addMessage('user', message, 'user');
            
            // Send via WebSocket if available
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(JSON.stringify({
                    type: 'message',
                    content: message,
                    timestamp: new Date().toISOString()
                }));
            } else {
                // Fallback to HTTP
                sendViaHttp(message);
            }

            // Clear input
            input.value = '';
        }

        function sendViaHttp(message) {
            const system = systems[currentSystem];
            
            fetch(system.endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: message,
                    system: currentSystem
                })
            })
            .then(response => response.json())
            .then(data => {
                addMessage(currentSystem, data.response || 'Message received', currentSystem);
            })
            .catch(error => {
                addMessage('error', `Failed to send message: ${error.message}`, 'error');
            });
        }

        function sendQuickCommand(command) {
            document.getElementById('messageInput').value = command;
            sendMessage();
        }

        function addMessage(sender, content, type) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            
            messageDiv.innerHTML = `
                <div class="message-header">${sender} • ${timestamp}</div>
                <div class="message-content">${content}</div>
            `;
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
            
            messageCount++;
            document.getElementById('messageCount').textContent = messageCount;
        }

        function updateStatus(text, status) {
            document.getElementById('statusText').textContent = text;
            const dot = document.getElementById('statusDot');
            dot.className = `status-dot ${status}`;
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleString();
        }

        function updateUptime() {
            const elapsed = Date.now() - startTime;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            document.getElementById('uptime').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
