<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ursula - Central Nervous System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #00ff41;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        
        .header h1 {
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ff41;
            margin: 0;
            animation: pulse 2s infinite;
        }
        
        .header .subtitle {
            font-size: 1.2em;
            color: #00ff41;
            opacity: 0.8;
            margin-top: 5px;
        }
        
        .connection-status {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(0, 255, 65, 0.1);
            border-radius: 5px;
            border: 1px solid #00ff41;
        }
        
        .connection-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff0000;
            animation: blink 1s infinite;
        }
        
        .connection-dot.connected {
            background: #00ff41;
            animation: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            background: #111;
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #00ff41;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff41;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: #111;
            padding: 20px;
            border-radius: 5px;
            border: 1px solid #00ff41;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            opacity: 0.8;
            font-size: 0.9em;
        }
        
        .event-stream {
            background: #111;
            border: 1px solid #00ff41;
            border-radius: 5px;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
        }
        
        .event {
            margin-bottom: 10px;
            padding: 10px;
            border-left: 3px solid #00ff41;
            background: rgba(0, 255, 65, 0.05);
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .event.heidi_alert {
            border-left-color: #ff9900;
            background: rgba(255, 153, 0, 0.1);
        }
        
        .event.proof_of_work {
            border-left-color: #0099ff;
            background: rgba(0, 153, 255, 0.1);
        }
        
        .event.value_opportunity {
            border-left-color: #ff00ff;
            background: rgba(255, 0, 255, 0.1);
        }
        
        .event.system_status {
            border-left-color: #00ff41;
        }
        
        .event-time {
            opacity: 0.6;
            font-size: 0.8em;
        }
        
        .event-type {
            font-weight: bold;
            margin: 5px 0;
        }
        
        .event-message {
            opacity: 0.9;
        }
        
        .error-message {
            color: #ff4444;
            text-align: center;
            padding: 20px;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            border-radius: 5px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>URSULA</h1>
        <div class="subtitle">Central Nervous System</div>
        <div class="connection-status">
            <div class="connection-dot" id="connectionDot"></div>
            <span id="connectionText">Connecting...</span>
        </div>
    </div>
    
    <div class="stats">
        <div class="stat-card">
            <div class="stat-value" id="eventCount">0</div>
            <div class="stat-label">Events Processed</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="opportunityCount">0</div>
            <div class="stat-label">Opportunities</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="alertCount">0</div>
            <div class="stat-label">System Alerts</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="uptime">00:00</div>
            <div class="stat-label">Connection Uptime</div>
        </div>
    </div>
    
    <div class="status-bar">
        <div class="status-item">
            <div class="status-indicator" id="systemIndicator"></div>
            <span id="systemStatus">Initializing...</span>
        </div>
        <div class="status-item">
            <span id="eventBusStatus">Event Bus: Checking...</span>
        </div>
        <div class="status-item">
            <span id="heidiStatus">Heidi: Checking...</span>
        </div>
        <div class="status-item">
            <span id="integrityStatus">Integrity: Checking...</span>
        </div>
    </div>
    
    <div id="errorContainer"></div>
    
    <div class="event-stream" id="eventStream"></div>
    
    <script>
        // Configuration
        const isDevelopment = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const eventSourceUrl = isDevelopment 
            ? 'http://localhost:3005/events/stream'
            : `${window.location.protocol}//${window.location.host}/events/stream`;
        
        // State tracking
        let eventCount = 0;
        let opportunityCount = 0;
        let alertCount = 0;
        let connectionStartTime = null;
        let lastHeartbeat = null;
        let isActuallyConnected = false;
        
        // DOM elements
        const eventStream = document.getElementById('eventStream');
        const connectionDot = document.getElementById('connectionDot');
        const connectionText = document.getElementById('connectionText');
        const errorContainer = document.getElementById('errorContainer');
        
        // Status elements
        const systemIndicator = document.getElementById('systemIndicator');
        const systemStatus = document.getElementById('systemStatus');
        const eventBusStatus = document.getElementById('eventBusStatus');
        const heidiStatus = document.getElementById('heidiStatus');
        const integrityStatus = document.getElementById('integrityStatus');
        
        // Add error message
        function addError(message) {
            errorContainer.innerHTML = `
                <div class="error-message">
                    <strong>Connection Error:</strong> ${message}
                    <br><br>
                    <strong>URL:</strong> ${eventSourceUrl}
                    <br>
                    <strong>Environment:</strong> ${isDevelopment ? 'Development' : 'Production'}
                </div>
            `;
        }
        
        // Clear error message
        function clearError() {
            errorContainer.innerHTML = '';
        }
        
        // Update system status based on actual connection state
        function updateSystemStatus(connected) {
            isActuallyConnected = connected;
            
            if (connected) {
                systemIndicator.style.background = '#00ff41';
                systemStatus.textContent = 'System Status: OPERATIONAL';
                eventBusStatus.textContent = 'ProtoForge Event Bus: ACTIVE';
                heidiStatus.textContent = 'Heidi Conscience: ONLINE';
                integrityStatus.textContent = 'Cascade Integrity: SECURE';
                clearError();
            } else {
                systemIndicator.style.background = '#ff0000';
                systemStatus.textContent = 'System Status: DEGRADED';
                eventBusStatus.textContent = 'ProtoForge Event Bus: DISCONNECTED';
                heidiStatus.textContent = 'Heidi Conscience: UNREACHABLE';
                integrityStatus.textContent = 'Cascade Integrity: UNKNOWN';
            }
        }
        
        // Connect to EventSource with proper error handling
        let eventSource = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        const reconnectDelay = 3000;
        
        function connectEventSource() {
            try {
                console.log(`Connecting to: ${eventSourceUrl}`);
                eventSource = new EventSource(eventSourceUrl);
                
                eventSource.onopen = () => {
                    console.log('EventSource connected');
                    connectionDot.classList.add('connected');
                    connectionText.textContent = 'Connected';
                    connectionStartTime = Date.now();
                    reconnectAttempts = 0;
                    updateSystemStatus(true);
                    addEvent('system_status', 'Connected to ProtoForge Central Nervous System');
                };
                
                eventSource.onerror = (error) => {
                    console.error('EventSource error:', error);
                    connectionDot.classList.remove('connected');
                    connectionText.textContent = 'Disconnected';
                    updateSystemStatus(false);
                    
                    if (eventSource.readyState === EventSource.CLOSED) {
                        addEvent('system_status', 'Lost connection to Central Nervous System', 'heidi_alert');
                        
                        // Try to reconnect
                        if (reconnectAttempts < maxReconnectAttempts) {
                            reconnectAttempts++;
                            addEvent('system_status', `Attempting reconnection ${reconnectAttempts}/${maxReconnectAttempts}...`);
                            setTimeout(connectEventSource, reconnectDelay);
                        } else {
                            addError(`Failed to connect after ${maxReconnectAttempts} attempts. The server may be down or the URL ${eventSourceUrl} is not accessible.`);
                        }
                    }
                };
                
                // Handle specific event types
                eventSource.addEventListener('connected', (e) => {
                    const data = JSON.parse(e.data);
                    addEvent(data.type, data.message);
                });
                
                eventSource.addEventListener('heartbeat', (e) => {
                    const data = JSON.parse(e.data);
                    lastHeartbeat = Date.now();
                    
                    // Update uptime
                    if (connectionStartTime) {
                        const uptime = Date.now() - connectionStartTime;
                        const minutes = Math.floor(uptime / 60000);
                        const seconds = Math.floor((uptime % 60000) / 1000);
                        document.getElementById('uptime').textContent = 
                            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    }
                });
                
                eventSource.addEventListener('heidi_alert', (e) => {
                    const data = JSON.parse(e.data);
                    addEvent(data.type, data.message, 'heidi_alert');
                    alertCount++;
                    document.getElementById('alertCount').textContent = alertCount;
                });
                
                eventSource.addEventListener('proof_of_work', (e) => {
                    const data = JSON.parse(e.data);
                    addEvent(data.type, data.message, 'proof_of_work');
                });
                
                eventSource.addEventListener('value_opportunity', (e) => {
                    const data = JSON.parse(e.data);
                    addEvent(data.type, data.message, 'value_opportunity');
                    opportunityCount++;
                    document.getElementById('opportunityCount').textContent = opportunityCount;
                });
                
                eventSource.addEventListener('validation_complete', (e) => {
                    const data = JSON.parse(e.data);
                    addEvent(data.type, `Event validated: ${data.event_id}`, 'validation_complete');
                });
                
                eventSource.addEventListener('hyve_opportunity_detected', (e) => {
                    const data = JSON.parse(e.data);
                    addEvent('hyve_opportunity', `Opportunity: ${data.payload.opportunity_classification.opportunity_type}`, 'value_opportunity');
                    opportunityCount++;
                    document.getElementById('opportunityCount').textContent = opportunityCount;
                });
                
            } catch (error) {
                console.error('Failed to create EventSource:', error);
                addError(`Failed to create connection: ${error.message}`);
                updateSystemStatus(false);
            }
        }
        
        function addEvent(type, message, className = '') {
            eventCount++;
            document.getElementById('eventCount').textContent = eventCount;
            
            const event = document.createElement('div');
            event.className = `event ${className} ${type}`;
            
            const time = new Date().toLocaleTimeString();
            event.innerHTML = `
                <div class="event-time">${time}</div>
                <div class="event-type">${type.toUpperCase()}</div>
                <div class="event-message">${message}</div>
            `;
            
            eventStream.appendChild(event);
            eventStream.scrollTop = eventStream.scrollHeight;
            
            // Limit events to 100
            while (eventStream.children.length > 100) {
                eventStream.removeChild(eventStream.firstChild);
            }
        }
        
        // Start connection
        updateSystemStatus(false);
        connectEventSource();
        
        // Add initial status message
        addEvent('system_status', `Ursula Dashboard Initializing (${isDevelopment ? 'Development' : 'Production'} Mode)`);
        addEvent('system_status', `Target: ${eventSourceUrl}`);
    </script>
</body>
</html>
