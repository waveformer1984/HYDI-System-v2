<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ursula - Central Nervous System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #00ff41;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        
        .header h1 {
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ff41;
            margin: 0;
            animation: pulse 2s infinite;
        }
        
        .header .subtitle {
            font-size: 1.2em;
            color: #00ff41;
            opacity: 0.8;
            margin-top: 5px;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            background: #111;
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #00ff41;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00ff41;
            animation: blink 1s infinite;
        }
        
        .event-stream {
            height: calc(100vh - 200px);
            overflow-y: auto;
            background: #0a0a0a;
            border: 1px solid #00ff41;
            border-radius: 5px;
            padding: 10px;
            font-family: 'Courier New', monospace;
        }
        
        .event {
            margin-bottom: 10px;
            padding: 10px;
            border-left: 3px solid #00ff41;
            background: #111;
            animation: slideIn 0.3s ease-out;
        }
        
        .event.heidi_alert {
            border-left-color: #ff4444;
            background: #1a0a0a;
        }
        
        .event.proof_of_work {
            border-left-color: #44ff44;
            background: #0a1a0a;
        }
        
        .event.value_opportunity {
            border-left-color: #ffff44;
            background: #1a1a0a;
        }
        
        .event.validation_complete {
            border-left-color: #44ffff;
            background: #0a1a1a;
        }
        
        .event.system_status {
            border-left-color: #ff44ff;
            background: #1a0a1a;
        }
        
        .event-time {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 5px;
        }
        
        .event-type {
            font-weight: bold;
            color: #00ff41;
            margin-bottom: 5px;
        }
        
        .event-message {
            white-space: pre-wrap;
        }
        
        .connection-status {
            position: absolute;
            top: 10px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .connection-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
        }
        
        .connection-dot.connected {
            background: #00ff41;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            flex: 1;
            background: #111;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #00ff41;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #00ff41;
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="connection-status">
            <div class="connection-dot" id="connectionDot"></div>
            <span id="connectionText">Disconnected</span>
        </div>
        <h1>URSULA</h1>
        <div class="subtitle">Central Nervous System - The Voice of the Machine</div>
    </div>
    
    <div class="stats">
        <div class="stat-card">
            <div class="stat-value" id="eventCount">0</div>
            <div class="stat-label">Events Broadcast</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="opportunityCount">0</div>
            <div class="stat-label">Opportunities</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="alertCount">0</div>
            <div class="stat-label">System Alerts</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="uptime">00:00</div>
            <div class="stat-label">Uptime</div>
        </div>
    </div>
    
    <div class="status-bar">
        <div class="status-item">
            <div class="status-indicator"></div>
            <span>System Status: OPERATIONAL</span>
        </div>
        <div class="status-item">
            <span>ProtoForge Event Bus: ACTIVE</span>
        </div>
        <div class="status-item">
            <span>Heidi Conscience: ONLINE</span>
        </div>
        <div class="status-item">
            <span>Cascade Integrity: SECURE</span>
        </div>
    </div>
    
    <div class="event-stream" id="eventStream"></div>
    
    <script>
        let eventCount = 0;
        let opportunityCount = 0;
        let alertCount = 0;
        let startTime = Date.now();
        
        const eventStream = document.getElementById('eventStream');
        const connectionDot = document.getElementById('connectionDot');
        const connectionText = document.getElementById('connectionText');
        
        // Connect to Ursula's SSE stream
        const eventSource = new EventSource('http://localhost:3005/events/stream');
        
        eventSource.onopen = () => {
            connectionDot.classList.add('connected');
            connectionText.textContent = 'Connected';
            addEvent('system_status', 'Connected to ProtoForge Central Nervous System');
        };
        
        eventSource.onerror = () => {
            connectionDot.classList.remove('connected');
            connectionText.textContent = 'Disconnected';
            addEvent('system_status', 'Lost connection to Central Nervous System', 'heidi_alert');
        };
        
        eventSource.addEventListener('connected', (e) => {
            const data = JSON.parse(e.data);
            addEvent(data.type, data.message);
        });
        
        eventSource.addEventListener('heartbeat', (e) => {
            const data = JSON.parse(e.data);
            // Update uptime
            const uptime = Date.now() - startTime;
            const minutes = Math.floor(uptime / 60000);
            const seconds = Math.floor((uptime % 60000) / 1000);
            document.getElementById('uptime').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        });
        
        eventSource.addEventListener('heidi_alert', (e) => {
            const data = JSON.parse(e.data);
            addEvent(data.type, data.message, 'heidi_alert');
            alertCount++;
            document.getElementById('alertCount').textContent = alertCount;
        });
        
        eventSource.addEventListener('proof_of_work', (e) => {
            const data = JSON.parse(e.data);
            addEvent(data.type, data.message, 'proof_of_work');
        });
        
        eventSource.addEventListener('value_opportunity', (e) => {
            const data = JSON.parse(e.data);
            addEvent(data.type, data.message, 'value_opportunity');
            opportunityCount++;
            document.getElementById('opportunityCount').textContent = opportunityCount;
        });
        
        eventSource.addEventListener('validation_complete', (e) => {
            const data = JSON.parse(e.data);
            addEvent(data.type, `Event validated: ${data.event_id}`, 'validation_complete');
        });
        
        eventSource.addEventListener('hyve_opportunity_detected', (e) => {
            const data = JSON.parse(e.data);
            addEvent('hyve_opportunity', `Opportunity: ${data.payload.opportunity_classification.opportunity_type}`, 'value_opportunity');
            opportunityCount++;
            document.getElementById('opportunityCount').textContent = opportunityCount;
        });
        
        function addEvent(type, message, className = '') {
            eventCount++;
            document.getElementById('eventCount').textContent = eventCount;
            
            const event = document.createElement('div');
            event.className = `event ${className} ${type}`;
            
            const time = new Date().toLocaleTimeString();
            event.innerHTML = `
                <div class="event-time">${time}</div>
                <div class="event-type">${type.toUpperCase()}</div>
                <div class="event-message">${message}</div>
            `;
            
            eventStream.appendChild(event);
            eventStream.scrollTop = eventStream.scrollHeight;
            
            // Limit events to 100
            while (eventStream.children.length > 100) {
                eventStream.removeChild(eventStream.firstChild);
            }
        }
        
        // Simulate some initial system events
        setTimeout(() => {
            addEvent('system_status', 'Magnetic Rail: Stabilized');
            addEvent('system_status', 'Laser Harp: Calibrated');
            addEvent('system_status', 'Power Core: 48V DC - Ready');
            addEvent('system_status', 'Cooling Systems: Optimal Flow');
        }, 1000);
    </script>
</body>
</html>
