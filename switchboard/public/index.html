<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Switchboard</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #f7f7f7; color: #222; }
    nav { display: flex; gap: 1rem; padding: 0.5rem; background: #fff; border-bottom: 1px solid #ddd; margin: -1rem -1rem 1rem; }
    button { border: none; padding: 0.5rem 1rem; background: #0366d6; color: #fff; border-radius: 4px; cursor: pointer; }
    button.secondary { background: #555; }
    input, textarea, select { width: 100%; padding: 0.5rem; margin: 0.25rem 0 0.75rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .card { background: #fff; padding: 1rem; border-radius: 6px; box-shadow: 0 1px 3px #0001; margin-bottom: 1rem; }
    .hidden { display: none; }
    h2 { margin-top: 0; }
    .score { font-weight: bold; color: #0366d6; }
  </style>
</head>
<body>
  <nav>
    <button onclick="show('login')">Login</button>
    <button onclick="show('dashboard')">Dashboard</button>
    <button onclick="show('gigs')">Gig Feed</button>
    <button onclick="show('profile')">Profile</button>
    <button onclick="show('messages')">Messages</button>
    <button onclick="show('applications')">Applications</button>
    <button onclick="show('trust')">Trust</button>
    <button onclick="show('parent')">Parent Approval</button>
    <a href="moderation.html"><button>Moderation</button></a>
    <a href="availability.html"><button>Availability</button></a>
  </nav>

  <main id="app"></main>

  <script src="/app.js"></script>
</body>
</html>
