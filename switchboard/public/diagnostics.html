<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Switchboard Diagnostics</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #f7f7f7; color: #222; }
    .card { background: #fff; padding: 1rem; border-radius: 6px; box-shadow: 0 1px 3px #0001; margin-bottom: 1rem; }
    pre { background: #eee; padding: 1rem; border-radius: 4px; overflow: auto; }
    .ok { color: green; }
    .bad { color: red; }
  </style>
</head>
<body>
  <h1>Switchboard Diagnostics</h1>
  <div class="card">
    <button id="refresh">Refresh</button>
    <div id="status"></div>
    <pre id="output"></pre>
  </div>
  <script>
    const API = window.SWITCHBOARD_API || 'http://localhost:3001';
    const out = document.getElementById('output');
    const status = document.getElementById('status');
    async function load() {
      try {
        const res = await fetch(`${API}/diagnostics`);
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
        status.innerHTML = data.storage.healthy ? '<span class="ok">Healthy</span>' : '<span class="bad">Unhealthy</span>';
      } catch (e) {
        out.textContent = 'Error: ' + e.message;
        status.innerHTML = '<span class="bad">Offline</span>';
      }
    }
    document.getElementById('refresh').onclick = load;
    load();
  </script>
</body>
</html>
