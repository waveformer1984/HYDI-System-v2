<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Switchboard Availability Calendar" />
  <title>Availability Calendar — Switchboard</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="ui.js"></script>
</head>
<body>
  <header>
    <div class="inner">
      <h1>Availability</h1>
      <a class="btn" href="index.html" style="background:#6b7280">Back</a>
    </div>
  </header>

  <main role="main">
    <div class="card">
      <h2>Set Weekly Schedule</h2>
      <div class="field">
        <label for="userId">User ID</label>
        <input type="text" id="userId" />
      </div>
      <div class="field">
        <label for="timezone">Timezone</label>
        <input type="text" id="timezone" value="UTC" />
      </div>
      <div id="days" class="grid"></div>
      <div class="actions">
        <button id="saveProfile">Save Profile</button>
      </div>
      <div id="profileFeedback" role="status" aria-live="polite"></div>
    </div>

    <div class="card">
      <h2>Add Exception</h2>
      <div class="field">
        <label for="exStart">Start</label>
        <input type="datetime-local" id="exStart" />
      </div>
      <div class="field">
        <label for="exEnd">End</label>
        <input type="datetime-local" id="exEnd" />
      </div>
      <div class="field">
        <label for="exReason">Reason</label>
        <input type="text" id="exReason" />
      </div>
      <div class="actions">
        <button id="addException" class="warning">Add Exception</button>
      </div>
      <div id="exceptionFeedback" role="status" aria-live="polite"></div>
    </div>

    <div class="card">
      <h2>Current Availability</h2>
      <div class="actions">
        <button id="loadProfile" class="secondary">Load</button>
      </div>
      <div id="profileView" role="region" aria-live="polite"></div>

      <h3>Next Available Slot</h3>
      <div id="nextSlot" role="region" aria-live="polite"></div>

      <h3>Check a Date</h3>
      <div class="actions">
        <input type="date" id="checkDate" />
        <button id="checkDateBtn">Check</button>
      </div>
      <div id="dateSlots" role="region" aria-live="polite"></div>
    </div>
  </main>

  <script>
    const DAYS = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];

    function renderDayInputs() {
      const container = document.getElementById('days');
      container.innerHTML = DAYS.map(day => `
        <div class="card">
          <strong>${day}</strong>
          <div id="slots-${day}" class="stack"></div>
          <button type="button" class="secondary" onclick="addSlot('${day}')">+ Slot</button>
        </div>
      `).join('');
      DAYS.forEach(day => addSlot(day));
    }

    window.addSlot = (day) => {
      const div = document.getElementById(`slots-${day}`);
      const row = document.createElement('div');
      row.className = 'actions';
      row.innerHTML = `<input type="time" class="start-${day}" value="09:00" aria-label="${day} start" /> - <input type="time" class="end-${day}" value="17:00" aria-label="${day} end" />`;
      div.appendChild(row);
    };

    function buildWeekly() {
      const weekly = {};
      DAYS.forEach(day => {
        const starts = [...document.querySelectorAll(`.start-${day}`)].map(i => i.value).filter(v => v);
        const ends = [...document.querySelectorAll(`.end-${day}`)].map(i => i.value).filter(v => v);
        if (starts.length) weekly[day] = starts.map((s, i) => ({ start: s, end: ends[i] }));
      });
      return weekly;
    }

    async function saveProfile() {
      const fb = document.getElementById('profileFeedback');
      SB.loading(fb, 'Saving...');
      try {
        const userId = document.getElementById('userId').value;
        const timezone = document.getElementById('timezone').value;
        const weekly = buildWeekly();
        await SB.request(`/availability/${userId}`, { method: 'POST', body: JSON.stringify({ timezone, weekly }) });
        SB.success(fb, 'Profile saved.');
        await load();
      } catch (e) { SB.error(fb, e.message); }
    }

    async function addException() {
      const fb = document.getElementById('exceptionFeedback');
      SB.loading(fb, 'Adding...');
      try {
        const userId = document.getElementById('userId').value;
        const start = new Date(document.getElementById('exStart').value).toISOString();
        const end = new Date(document.getElementById('exEnd').value).toISOString();
        const reason = document.getElementById('exReason').value;
        await SB.request(`/availability/${userId}/exceptions`, { method: 'POST', body: JSON.stringify({ start_time: start, end_time: end, reason }) });
        SB.success(fb, 'Exception added.');
        await load();
      } catch (e) { SB.error(fb, e.message); }
    }

    async function load() {
      const userId = document.getElementById('userId').value;
      if (!userId) return SB.empty(document.getElementById('profileView'), 'Enter a user ID to load availability.');
      const view = document.getElementById('profileView');
      const next = document.getElementById('nextSlot');
      view.textContent = '';
      next.textContent = '';
      SB.loading(view, 'Loading availability...');
      try {
        const data = await SB.request(`/availability/${userId}`);
        if (data.profile) {
          document.getElementById('timezone').value = data.profile.timezone || 'UTC';
          let html = `<p><strong>Timezone:</strong> ${data.profile.timezone}</p>`;
          for (const [day, slots] of Object.entries(data.profile.weekly || {})) {
            if (slots && slots.length) {
              html += `<p><strong>${day}:</strong> ${slots.map(s => `<span class="slot">${s.start} - ${s.end}</span>`).join('')}</p>`;
            } else {
              html += `<p><strong>${day}:</strong> <span class="unavailable">Unavailable</span></p>`;
            }
          }
          view.innerHTML = html;
          next.innerHTML = data.nextSlot
            ? `<span class="slot">${data.nextSlot.date} ${new Date(data.nextSlot.slot.start_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} - ${new Date(data.nextSlot.slot.end_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>`
            : '<p class="unavailable">No upcoming slots</p>';
        } else {
          SB.empty(view, 'No profile set.');
        }
      } catch (e) { SB.error(view, e.message); }
    }

    async function checkDate() {
      const userId = document.getElementById('userId').value;
      const date = document.getElementById('checkDate').value;
      const out = document.getElementById('dateSlots');
      if (!userId || !date) return;
      SB.loading(out, 'Checking...');
      try {
        const slots = await SB.request(`/availability/${userId}/date/${date}`);
        out.innerHTML = slots.length
          ? slots.map(s => `<p class="slot">${new Date(s.start_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} - ${new Date(s.end_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</p>`).join('')
          : '<p class="unavailable">Unavailable</p>';
      } catch (e) { SB.error(out, e.message); }
    }

    document.getElementById('saveProfile').addEventListener('click', saveProfile);
    document.getElementById('addException').addEventListener('click', addException);
    document.getElementById('loadProfile').addEventListener('click', load);
    document.getElementById('checkDateBtn').addEventListener('click', checkDate);

    renderDayInputs();
  </script>
</body>
</html>
