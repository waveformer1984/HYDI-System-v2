# SignalDesk local stack. Application and worker run on the host by default
# (hot reload). Use profile "full" to run the web container too.
#
#   docker compose -f apps/signaldesk/docker-compose.yml up -d
#   cp apps/signaldesk/.env.example apps/signaldesk/.env.local
#   cd apps/signaldesk && npm ci && npm run db:migrate && npm run dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signaldesk
      POSTGRES_PASSWORD: signaldesk
      POSTGRES_DB: signaldesk
    ports:
      - '55433:5432'
    volumes:
      - signaldesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U signaldesk']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    profiles: ['full']
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3600:3600'
    env_file: .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: ['full']
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  signaldesk_pg: