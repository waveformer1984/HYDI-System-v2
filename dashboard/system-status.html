<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYDI System Status</title>
    <script src="status-data.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 28px;
            border-radius: 12px;
            margin-bottom: 28px;
            border: 1px solid #2a2a4e;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .project-code { color: #888; font-family: monospace; font-size: 0.9rem; }
        .freshness {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 12px;
        }
        .freshness.live { background: rgba(0, 255, 136, 0.15); color: #00ff88; border: 1px solid #00ff88; }
        .freshness.stale { background: rgba(255, 165, 0, 0.15); color: #ffa500; border: 1px solid #ffa500; }
        .freshness.unavailable { background: rgba(255, 68, 68, 0.15); color: #ff4444; border: 1px solid #ff4444; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 28px; }
        .card {
            background: #141420;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #2a2a4e;
        }
        .card h3 { color: #888; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .card .value { font-size: 1.8rem; font-weight: 700; color: #fff; }
        .card .value.ok { color: #00ff88; }
        .card .value.degraded { color: #ffa500; }
        .card .value.down { color: #ff4444; }
        .card .value.unknown { color: #888; }
        .card .subtext { color: #666; font-size: 0.85rem; margin-top: 8px; }
        .agent-list { background: #141420; border-radius: 12px; border: 1px solid #2a2a4e; overflow: hidden; }
        .agent-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #2a2a4e;
        }
        .agent-item:last-child { border-bottom: none; }
        .agent-name { font-weight: 600; }
        .agent-detail { color: #888; font-size: 0.85rem; max-width: 60%; text-align: right; }
        .status-pill {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-pill.ok { background: rgba(0, 255, 136, 0.15); color: #00ff88; }
        .status-pill.degraded { background: rgba(255, 165, 0, 0.15); color: #ffa500; }
        .status-pill.down { background: rgba(255, 68, 68, 0.15); color: #ff4444; }
        .status-pill.unknown { background: rgba(136, 136, 136, 0.15); color: #888; }
        .section-title { color: #fff; font-size: 1.2rem; margin: 28px 0 16px; }
        .timestamp { color: #666; font-size: 0.85rem; font-family: monospace; }
        .notice { background: #1a1a2e; border: 1px dashed #2a2a4e; padding: 16px; border-radius: 8px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>HYDI System Status</h1>
            <div class="project-code">https://hydi-system.vercel.app</div>
            <div id="freshness" class="freshness live">LIVE</div>
            <div class="timestamp" id="source">Source: –</div>
            <div class="timestamp" id="lastChecked">Loading…</div>
        </header>

        <div class="section-title">Pipeline & Infrastructure</div>
        <div class="grid">
            <div class="card">
                <h3>Supabase</h3>
                <div class="value" id="supabaseValue">–</div>
                <div class="subtext" id="supabaseDetail">–</div>
            </div>
            <div class="card">
                <h3>Pipeline</h3>
                <div class="value" id="pipelineValue">–</div>
                <div class="subtext" id="pipelineDetail">–</div>
            </div>
            <div class="card">
                <h3>Last Successful Poll</h3>
                <div class="value" id="lastSuccessValue">–</div>
                <div class="subtext" id="lastFailureValue">No failures</div>
            </div>
        </div>

        <div class="section-title">Agents</div>
        <div id="agents" class="agent-list">
            <div class="notice">Waiting for data…</div>
        </div>
    </div>

    <script>
        const data = (typeof window.HYDI_STATUS !== 'undefined') ? window.HYDI_STATUS : null;

        function statusClass(status) {
            if (!status) return 'unknown';
            const s = String(status).toLowerCase();
            if (s === 'ok' || s === 'healthy' || s === 'live' || s === 'up') return 'ok';
            if (s === 'degraded' || s === 'stale' || s === 'warn') return 'degraded';
            if (s === 'down' || s === 'failed' || s === 'error') return 'down';
            return 'unknown';
        }

        function render() {
            if (!data || !data.payload) {
                document.getElementById('freshness').textContent = 'UNAVAILABLE';
                document.getElementById('freshness').className = 'freshness unavailable';
                document.getElementById('lastChecked').textContent = 'No cached data.';
                return;
            }

            const payload = data.payload;
            const lastChecked = new Date(data.last_checked || data.payload.checkedAt);
            const now = new Date();
            const ageMinutes = Math.floor((now - lastChecked) / 60000);

            const freshnessEl = document.getElementById('freshness');
            if (data.status === 'live' && ageMinutes < 10) {
                freshnessEl.textContent = 'LIVE';
                freshnessEl.className = 'freshness live';
            } else if (ageMinutes < 30) {
                freshnessEl.textContent = 'STALE';
                freshnessEl.className = 'freshness stale';
            } else {
                freshnessEl.textContent = 'UNAVAILABLE';
                freshnessEl.className = 'freshness unavailable';
            }

            const sourceMap = {
                'supabase': 'LIVE · SUPABASE',
                'local-hydi': 'LIVE · HYDI LOCAL BRIDGE',
                'degraded': 'STALE',
                'unavailable': 'UNAVAILABLE'
            };
            const statusSource = payload.status_source || 'unavailable';
            document.getElementById('source').textContent = `Source: ${sourceMap[statusSource] || statusSource}`;

            document.getElementById('lastChecked').textContent =
                `Last checked: ${lastChecked.toISOString()} (${ageMinutes}m ago)`;

            const sup = payload.supabase || {};
            document.getElementById('supabaseValue').textContent = sup.status || 'unknown';
            document.getElementById('supabaseValue').className = 'value ' + statusClass(sup.status);
            document.getElementById('supabaseDetail').textContent = sup.detail || '';

            const pipe = payload.pipeline || {};
            document.getElementById('pipelineValue').textContent = pipe.status || 'unknown';
            document.getElementById('pipelineValue').className = 'value ' + statusClass(pipe.status);
            document.getElementById('pipelineDetail').textContent = pipe.current_status || '';

            document.getElementById('lastSuccessValue').textContent = data.last_success ? new Date(data.last_success).toISOString() : '–';
            document.getElementById('lastFailureValue').textContent = data.last_failure
                ? `Last failure: ${new Date(data.last_failure).toISOString()} (count: ${data.failure_count || 0})`
                : `Failure count: ${data.failure_count || 0}`;

            const agentsEl = document.getElementById('agents');
            agentsEl.innerHTML = '';
            if (Array.isArray(payload.agents)) {
                payload.agents.forEach(agent => {
                    const cls = statusClass(agent.status);
                    const div = document.createElement('div');
                    div.className = 'agent-item';
                    div.innerHTML = `
                        <span class="agent-name">${agent.name}</span>
                        <div style="text-align:right;">
                            <span class="status-pill ${cls}">${agent.status || 'unknown'}</span>
                            ${agent.detail ? `<div class="agent-detail">${agent.detail}</div>` : ''}
                        </div>
                    `;
                    agentsEl.appendChild(div);
                });
            } else {
                agentsEl.innerHTML = '<div class="notice">No agent data in payload.</div>';
            }
        }

        render();
    </script>
</body>
</html>
