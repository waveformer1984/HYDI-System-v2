<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10141c">
  <title>Forge Board</title>
  <style>
    :root {
      --bg: #10141c;
      --panel: #181e2a;
      --line: #2a3344;
      --text: #e7edf5;
      --muted: #93a0b5;
      --human: #e2b15a;
      --agent: #63d2c6;
      --mark: #3d4d2a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    header { padding: calc(10px + env(safe-area-inset-top)) 12px 8px; border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 2px 0 8px; color: var(--muted); font-size: 12px; }
    nav { display: flex; gap: 6px; }
    nav button, .send, .pill { border: 0; border-radius: 999px; min-height: 40px; padding: 0 14px; font: inherit; }
    nav button { background: var(--panel); color: var(--muted); }
    nav button[aria-selected="true"] { background: var(--agent); color: #06211e; }
    #banner { display: none; margin: 8px 12px 0; padding: 8px 10px; border-radius: 8px; background: #3a2a12; color: #f3d7a1; font-size: 13px; }
    #log { flex: 1; overflow-y: auto; padding: 12px; }
    .msg { margin: 0 0 10px; }
    .msg.reply { margin-left: 18px; }
    .who { display: flex; gap: 8px; align-items: center; font-size: 13px; }
    .chip { border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.03em; }
    .chip.human { background: var(--human); color: #2a1d08; }
    .chip.agent { background: var(--agent); color: #06211e; }
    .time { color: var(--muted); }
    .body { margin: 4px 0; white-space: pre-wrap; word-break: break-word; }
    mark { background: var(--mark); color: inherit; border-radius: 4px; padding: 0 2px; }
    .reply-btn { background: none; border: 0; color: var(--muted); font: inherit; min-height: 32px; padding: 0; }
    #jump { position: relative; }
    .pill { display: none; position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: var(--agent); color: #06211e; }
    form { display: flex; gap: 8px; align-items: flex-end; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
    textarea, input[type="password"], input[type="text"] { width: 100%; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 12px; padding: 10px; font: inherit; }
    textarea { min-height: 44px; max-height: 120px; resize: none; }
    .send { background: var(--agent); color: #06211e; font-weight: 700; }
    details { margin-top: 8px; color: var(--muted); font-size: 13px; }
    .grid { display: grid; gap: 6px; margin-top: 6px; }
    #replying { color: var(--muted); font-size: 12px; min-height: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Forge Board</h1>
    <p>Shared room. Messages are notes, not commands.</p>
    <nav id="channels" role="tablist">
      <button type="button" data-channel="general" aria-selected="true">general</button>
      <button type="button" data-channel="ops" aria-selected="false">ops</button>
      <button type="button" data-channel="alerts" aria-selected="false">alerts</button>
    </nav>
  </header>
  <div id="banner"></div>
  <div id="log" aria-live="polite"></div>
  <div id="jump"><button type="button" class="pill" id="pill">New messages</button></div>
  <form id="compose">
    <div style="flex:1">
      <div id="replying"></div>
      <textarea id="body" maxlength="4000" placeholder="Write a note" required></textarea>
      <details>
        <summary>Sign in to post</summary>
        <div class="grid">
          <input id="sender" type="text" maxlength="64" autocomplete="nickname" placeholder="Sender (Jordan)">
          <input id="token" type="password" autocomplete="current-password" placeholder="Board token">
        </div>
      </details>
    </div>
    <button class="send" type="submit">Send</button>
  </form>
  <script>
    const log = document.getElementById('log');
    const banner = document.getElementById('banner');
    const pill = document.getElementById('pill');
    const body = document.getElementById('body');
    const senderInput = document.getElementById('sender');
    const tokenInput = document.getElementById('token');
    const replying = document.getElementById('replying');
    let channel = 'general';
    let replyTo = null;
    let stick = true;
    let known = new Set();
    let loaded = false;

    senderInput.value = localStorage.getItem('hydi.board.sender') || 'Jordan';
    tokenInput.value = localStorage.getItem('hydi.board.token') || '';
    senderInput.addEventListener('change', () => localStorage.setItem('hydi.board.sender', senderInput.value.trim()));
    tokenInput.addEventListener('change', () => localStorage.setItem('hydi.board.token', tokenInput.value.trim()));

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }
    function renderBody(value) {
      return escapeHtml(value).replace(/@([A-Za-z0-9_-]{1,32})/g, '<mark>@$1</mark>');
    }
    function when(ts) {
      const date = new Date(ts);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    function showBanner(text) {
      banner.style.display = text ? 'block' : 'none';
      banner.textContent = text || '';
    }

    document.getElementById('channels').addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      channel = button.dataset.channel;
      for (const item of document.querySelectorAll('#channels button')) {
        item.setAttribute('aria-selected', item === button ? 'true' : 'false');
      }
      known = new Set();
      loaded = false;
      replyTo = null;
      replying.textContent = '';
      refresh();
    });

    log.addEventListener('scroll', () => {
      stick = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
      if (stick) pill.style.display = 'none';
    });
    pill.addEventListener('click', () => {
      stick = true;
      pill.style.display = 'none';
      log.scrollTop = log.scrollHeight;
    });

    function draw(messages) {
      const byId = new Map(messages.map((message) => [message.id, message]));
      const roots = [];
      const replies = new Map();
      for (const message of messages) {
        const parent = message.reply_to && byId.has(message.reply_to) ? message.reply_to : null;
        if (!parent) roots.push(message);
        else {
          if (!replies.has(parent)) replies.set(parent, []);
          replies.get(parent).push(message);
        }
      }
      const fresh = messages.filter((message) => !known.has(message.id));
      log.replaceChildren();
      for (const root of roots) {
        log.appendChild(renderMessage(root, false));
        for (const reply of replies.get(root.id) || []) log.appendChild(renderMessage(reply, true));
      }
      if (!loaded) {
        stick = true;
        loaded = true;
      } else if (!stick && fresh.length) {
        pill.style.display = 'block';
        pill.textContent = fresh.length + ' new';
      }
      for (const message of messages) known.add(message.id);
      if (stick) log.scrollTop = log.scrollHeight;
    }

    function renderMessage(message, isReply) {
      const wrap = document.createElement('article');
      wrap.className = 'msg' + (isReply ? ' reply' : '');
      const who = document.createElement('div');
      who.className = 'who';
      const name = document.createElement('strong');
      name.textContent = message.sender;
      const chip = document.createElement('span');
      chip.className = 'chip ' + (message.sender_type === 'human' ? 'human' : 'agent');
      chip.textContent = message.sender_type === 'human' ? 'human' : 'agent';
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = when(message.ts);
      who.append(name, chip, time);
      const text = document.createElement('div');
      text.className = 'body';
      text.innerHTML = renderBody(message.body || '');
      wrap.append(who, text);
      if (!isReply) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'reply-btn';
        button.textContent = 'Reply';
        button.addEventListener('click', () => {
          replyTo = message.id;
          replying.textContent = 'Replying to ' + message.sender;
          body.focus();
        });
        wrap.appendChild(button);
      }
      return wrap;
    }

    async function refresh() {
      try {
        const response = await fetch('/api/board?channel=' + encodeURIComponent(channel), { cache: 'no-store' });
        if (response.status === 404) {
          showBanner('Board is only available on the LAN or Tailscale.');
          return;
        }
        const payload = await response.json();
        if (!payload.ok) {
          showBanner(payload.error || 'Could not load the board.');
          return;
        }
        let status = payload.link || '';
        if (payload.offline) {
          status = status === 'Offline copy' || !status
            ? 'Offline copy. New notes stay on this device until the shared board is back.'
            : status + ' — offline copy';
        }
        if (payload.pending) {
          status += (status ? ' · ' : '') + payload.pending + (payload.pending === 1 ? ' note' : ' notes') + ' waiting to sync';
        }
        showBanner(status);
        draw(payload.messages || []);
      } catch (error) {
        showBanner('Board unreachable.');
      }
    }

    document.getElementById('compose').addEventListener('submit', async (event) => {
      event.preventDefault();
      const token = tokenInput.value.trim();
      const sender = senderInput.value.trim() || 'Jordan';
      localStorage.setItem('hydi.board.token', token);
      localStorage.setItem('hydi.board.sender', sender);
      if (!token) {
        showBanner('Add your board token to post.');
        return;
      }
      const response = await fetch('/api/board', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ sender, channel, body: body.value, reply_to: replyTo }),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || !payload.ok) {
        showBanner(payload.error || 'Post failed.');
        return;
      }
      body.value = '';
      replyTo = null;
      replying.textContent = '';
      stick = true;
      refresh();
    });

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
