<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEIDI Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #00ff88;
            --accent-hover: #00cc6a;
            --danger: #ff4444;
            --warning: #ffaa00;
            --success: #00ff88;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            padding: 1rem;
            border-bottom: 1px solid var(--bg-tertiary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 1rem;
            font-size: 0.8rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
            animation: pulse 2s infinite;
        }

        .status-dot.online {
            background: var(--success);
        }

        .status-dot.degraded {
            background: var(--warning);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Tab Navigation */
        .tabs {
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--bg-tertiary);
        }

        .tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .tab.active {
            color: var(--accent);
            background: var(--bg-tertiary);
        }

        .tab:hover {
            color: var(--text-primary);
        }

        /* Content Areas */
        .content {
            flex: 1;
            overflow: hidden;
            display: none;
        }

        .content.active {
            display: flex;
            flex-direction: column;
        }

        /* Chat Styles */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: var(--accent);
            color: var(--bg-primary);
        }

        .message.heidi {
            align-self: flex-start;
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .message.error {
            align-self: flex-start;
            background: var(--danger);
            color: white;
        }

        .message-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 0.25rem;
        }

        /* Input Area */
        .input-area {
            padding: 1rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--bg-tertiary);
        }

        .input-container {
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .message-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--bg-primary);
            border-radius: 1.5rem;
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            max-height: 100px;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .voice-btn, .send-btn {
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .voice-btn {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .voice-btn.listening {
            background: var(--danger);
            color: white;
            animation: pulse 1s infinite;
        }

        .send-btn {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .voice-btn:hover, .send-btn:hover {
            transform: scale(1.1);
        }

        /* Task Feed Styles */
        .task-feed {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .task-item {
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .task-title {
            font-weight: 600;
            color: var(--text-primary);
        }

        .task-status {
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .task-status.pending {
            background: var(--warning);
            color: var(--bg-primary);
        }

        .task-status.completed {
            background: var(--success);
            color: var(--bg-primary);
        }

        .task-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Status Panel */
        .status-panel {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
        }

        .status-card {
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .status-card h3 {
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .status-value {
            color: var(--text-primary);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .status-detail {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            padding: 1rem;
        }

        .spinner {
            width: 1rem;
            height: 1rem;
            border: 2px solid var(--text-secondary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile Optimizations */
        @media (max-width: 480px) {
            .header {
                padding: 0.75rem;
            }
            
            .header h1 {
                font-size: 1rem;
            }
            
            .status-indicator {
                font-size: 0.7rem;
                padding: 0.2rem 0.5rem;
            }
            
            .tab {
                padding: 0.75rem 0.5rem;
                font-size: 0.8rem;
            }
            
            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>HEIDI</h1>
        <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Checking...</span>
        </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="tabs">
        <button class="tab active" data-tab="chat">Chat</button>
        <button class="tab" data-tab="tasks">Tasks</button>
        <button class="tab" data-tab="status">Status</button>
    </nav>

    <!-- Chat Content -->
    <div class="content active" id="chat">
        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="message heidi">
                    <div>👋 Hello! I'm HEIDI, your ProtoForge assistant. How can I help you today?</div>
                    <div class="message-time">Just now</div>
                </div>
            </div>
            <div class="input-area">
                <div class="input-container">
                    <div class="input-wrapper">
                        <textarea 
                            class="message-input" 
                            id="messageInput" 
                            placeholder="Type a message..."
                            rows="1"
                        ></textarea>
                    </div>
                    <button class="voice-btn" id="voiceBtn" title="Voice input">🎤</button>
                    <button class="send-btn" id="sendBtn" title="Send message">→</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tasks Content -->
    <div class="content" id="tasks">
        <div class="task-feed" id="taskFeed">
            <div class="loading">
                <div class="spinner"></div>
                <span>Loading tasks...</span>
            </div>
        </div>
    </div>

    <!-- Status Content -->
    <div class="content" id="status">
        <div class="status-panel" id="statusPanel">
            <div class="loading">
                <div class="spinner"></div>
                <span>Loading status...</span>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            BASE_URL: 'http://localhost:3458', // Change to ngrok URL for remote access
            POLL_INTERVAL: 5000,
            SESSION_ID: 'mobile-user-' + Date.now()
        };

        // State
        let currentTab = 'chat';
        let isListening = false;
        let recognition = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initializeTabs();
            initializeChat();
            initializeVoice();
            startPolling();
        });

        // Tab Navigation
        function initializeTabs() {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabName = tab.dataset.tab;
                    switchTab(tabName);
                });
            });
        }

        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');

            // Update content
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');

            currentTab = tabName;

            // Load content for tab
            if (tabName === 'tasks') {
                loadTasks();
            } else if (tabName === 'status') {
                loadStatus();
            }
        }

        // Chat Functions
        function initializeChat() {
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');

            // Auto-resize textarea
            input.addEventListener('input', () => {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 100) + 'px';
            });

            // Send on Enter (new line on Shift+Enter)
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Send button
            sendBtn.addEventListener('click', sendMessage);
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;

            // Add user message
            addMessage(message, 'user');
            input.value = '';
            input.style.height = 'auto';

            // Send to HEIDI
            try {
                const response = await fetch(`${CONFIG.BASE_URL}/think`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        input: message,
                        sessionId: CONFIG.SESSION_ID
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                addMessage(data.response, 'heidi');
            } catch (error) {
                console.error('Chat error:', error);
                addMessage('Sorry, I\'m having trouble connecting. The AI might be offline.', 'error');
            }
        }

        function addMessage(text, type) {
            const messagesContainer = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const textDiv = document.createElement('div');
            textDiv.textContent = text;
            
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = new Date().toLocaleTimeString();
            
            messageDiv.appendChild(textDiv);
            messageDiv.appendChild(timeDiv);
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Voice Functions
        function initializeVoice() {
            const voiceBtn = document.getElementById('voiceBtn');
            
            if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
                voiceBtn.style.display = 'none';
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                voiceBtn.classList.add('listening');
                voiceBtn.innerHTML = '⏹️';
            };

            recognition.onend = () => {
                isListening = false;
                voiceBtn.classList.remove('listening');
                voiceBtn.innerHTML = '🎤';
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('messageInput').value = transcript;
                sendMessage();
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                addMessage('Voice recognition failed. Please try typing instead.', 'error');
            };

            voiceBtn.addEventListener('click', () => {
                if (isListening) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });
        }

        // Task Functions
        async function loadTasks() {
            const taskFeed = document.getElementById('taskFeed');
            
            try {
                const response = await fetch(`${CONFIG.BASE_URL}/tasks`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                displayTasks(data.tasks || []);
            } catch (error) {
                console.error('Tasks error:', error);
                taskFeed.innerHTML = '<div class="message error">Failed to load tasks</div>';
            }
        }

        function displayTasks(tasks) {
            const taskFeed = document.getElementById('taskFeed');
            
            if (tasks.length === 0) {
                taskFeed.innerHTML = '<div style="text-align: center; color: var(--text-secondary); padding: 2rem;">No tasks yet</div>';
                return;
            }

            taskFeed.innerHTML = tasks.map(task => `
                <div class="task-item">
                    <div class="task-header">
                        <div class="task-title">${escapeHtml(task.title)}</div>
                        <div class="task-status ${task.status}">${task.status}</div>
                    </div>
                    ${task.description ? `<div class="task-description">${escapeHtml(task.description)}</div>` : ''}
                    <div class="task-meta">
                        <span>ID: ${task.id}</span>
                        <span>${new Date(task.createdAt).toLocaleString()}</span>
                    </div>
                </div>
            `).join('');
        }

        // Status Functions
        async function loadStatus() {
            const statusPanel = document.getElementById('statusPanel');
            
            try {
                const response = await fetch(`${CONFIG.BASE_URL}/health`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                displayStatus(data);
                updateHeaderStatus(data);
            } catch (error) {
                console.error('Status error:', error);
                statusPanel.innerHTML = '<div class="message error">Failed to load status</div>';
                updateHeaderStatus(null);
            }
        }

        function displayStatus(data) {
            const statusPanel = document.getElementById('statusPanel');
            
            statusPanel.innerHTML = `
                <div class="status-card">
                    <h3>System Status</h3>
                    <div class="status-value">${data.status || 'Unknown'}</div>
                    <div class="status-detail">Last checked: ${new Date().toLocaleString()}</div>
                </div>
                <div class="status-card">
                    <h3>AI Model</h3>
                    <div class="status-value">${data.model || 'Not loaded'}</div>
                    <div class="status-detail">Ollama integration</div>
                </div>
                <div class="status-card">
                    <h3>Active Sessions</h3>
                    <div class="status-value">${data.sessions || 0}</div>
                    <div class="status-detail">Current users</div>
                </div>
                <div class="status-card">
                    <h3>Total Tasks</h3>
                    <div class="status-value">${data.tasks || 0}</div>
                    <div class="status-detail">Created tasks</div>
                </div>
                <div class="status-card">
                    <h3>Server Info</h3>
                    <div class="status-value">Port 3458</div>
                    <div class="status-detail">Local development</div>
                </div>
            `;
        }

        function updateHeaderStatus(data) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            if (!data) {
                statusDot.className = 'status-dot';
                statusText.textContent = 'Offline';
            } else if (data.status === 'ok') {
                statusDot.className = 'status-dot online';
                statusText.textContent = 'Online';
            } else {
                statusDot.className = 'status-dot degraded';
                statusText.textContent = 'Degraded';
            }
        }

        // Polling
        function startPolling() {
            // Initial load
            loadStatus();
            
            // Poll for updates
            setInterval(() => {
                if (currentTab === 'tasks') {
                    loadTasks();
                } else if (currentTab === 'status') {
                    loadStatus();
                }
            }, CONFIG.POLL_INTERVAL);
        }

        // Utility
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
