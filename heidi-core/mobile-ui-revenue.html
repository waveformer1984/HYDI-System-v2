<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEIDI Revenue Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #00ff88;
            --accent-hover: #00cc6a;
            --danger: #ff4444;
            --warning: #ffaa00;
            --success: #00ff88;
            --critical: #ff0066;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            padding: 1rem;
            border-bottom: 1px solid var(--bg-tertiary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent);
        }

        .revenue-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 1rem;
            font-size: 0.8rem;
        }

        .revenue-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--critical);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Tab Navigation */
        .tabs {
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--bg-tertiary);
        }

        .tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .tab.active {
            color: var(--accent);
            background: var(--bg-tertiary);
        }

        .tab:hover {
            color: var(--text-primary);
        }

        /* Content Areas */
        .content {
            flex: 1;
            overflow: hidden;
            display: none;
        }

        .content.active {
            display: flex;
            flex-direction: column;
        }

        /* Revenue Tasks Styles */
        .revenue-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .revenue-summary {
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .revenue-summary h3 {
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .revenue-task {
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 0.75rem;
            position: relative;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .task-title {
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
        }

        .task-score {
            background: var(--accent);
            color: var(--bg-primary);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .task-category {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .task-description {
            color: var(--text-primary);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        .task-tags {
            display: flex;
            gap: 0.5rem;
        }

        .task-tag {
            padding: 0.2rem 0.4rem;
            border-radius: 0.2rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .tag-profit {
            background: var(--success);
            color: var(--bg-primary);
        }

        .tag-time {
            background: var(--warning);
            color: var(--bg-primary);
        }

        .tag-complexity {
            background: var(--danger);
            color: white;
        }

        .priority-badge {
            position: absolute;
            top: -0.5rem;
            right: -0.5rem;
            background: var(--critical);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 0.5rem;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Filter Controls */
        .filter-controls {
            padding: 1rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--bg-tertiary);
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .filter-btn {
            padding: 0.4rem 0.8rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--bg-primary);
            border-radius: 0.25rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.8rem;
        }

        .filter-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            padding: 2rem;
            justify-content: center;
        }

        .spinner {
            width: 1rem;
            height: 1rem;
            border: 2px solid var(--text-secondary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile Optimizations */
        @media (max-width: 480px) {
            .header {
                padding: 0.75rem;
            }
            
            .header h1 {
                font-size: 1rem;
            }
            
            .tab {
                padding: 0.75rem 0.5rem;
                font-size: 0.8rem;
            }
            
            .summary-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>HEIDI Revenue Engine</h1>
        <div class="revenue-indicator">
            <div class="revenue-dot"></div>
            <span id="revenueStatus">Loading...</span>
        </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="tabs">
        <button class="tab active" data-tab="top">Top Tasks</button>
        <button class="tab" data-tab="all">All Tasks</button>
        <button class="tab" data-tab="categories">Categories</button>
    </nav>

    <!-- Top Tasks Content -->
    <div class="content active" id="top">
        <div class="revenue-container" id="topTasks">
            <div class="loading">
                <div class="spinner"></div>
                <span>Loading top revenue tasks...</span>
            </div>
        </div>
    </div>

    <!-- All Tasks Content -->
    <div class="content" id="all">
        <div class="filter-controls">
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="critical">Critical</button>
                <button class="filter-btn" data-filter="high">High</button>
                <button class="filter-btn" data-filter="medium">Medium</button>
                <button class="filter-btn" data-filter="low">Low</button>
            </div>
        </div>
        <div class="revenue-container" id="allTasks">
            <div class="loading">
                <div class="spinner"></div>
                <span>Loading all revenue tasks...</span>
            </div>
        </div>
    </div>

    <!-- Categories Content -->
    <div class="content" id="categories">
        <div class="revenue-container" id="categoryTasks">
            <div class="loading">
                <div class="spinner"></div>
                <span>Loading categories...</span>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            BASE_URL: 'http://localhost:3458',
            POLL_INTERVAL: 10000
        };

        // State
        let currentTab = 'top';
        let allTasks = [];
        let currentFilter = 'all';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initializeTabs();
            initializeFilters();
            loadRevenueData();
            setInterval(loadRevenueData, CONFIG.POLL_INTERVAL);
        });

        // Tab Navigation
        function initializeTabs() {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabName = tab.dataset.tab;
                    switchTab(tabName);
                });
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');

            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');

            currentTab = tabName;
            displayContent(tabName);
        }

        // Filter Controls
        function initializeFilters() {
            const filters = document.querySelectorAll('.filter-btn');
            filters.forEach(filter => {
                filter.addEventListener('click', () => {
                    filters.forEach(f => f.classList.remove('active'));
                    filter.classList.add('active');
                    currentFilter = filter.dataset.filter;
                    displayContent('all');
                });
            });
        }

        // Load Revenue Data
        async function loadRevenueData() {
            try {
                const response = await fetch(`${CONFIG.BASE_URL}/revenue/tasks`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                allTasks = data.tasks;
                updateRevenueStatus(data.summary);
                displayContent(currentTab);
            } catch (error) {
                console.error('Revenue data error:', error);
                updateRevenueStatus(null);
            }
        }

        // Update Status
        function updateRevenueStatus(summary) {
            const statusDot = document.getElementById('revenueStatus');
            const revenueDot = document.querySelector('.revenue-dot');
            
            if (!summary) {
                statusDot.textContent = 'Offline';
                revenueDot.style.background = 'var(--danger)';
            } else {
                const criticalCount = summary.by_priority.Critical || 0;
                statusDot.textContent = `${criticalCount} Critical`;
                revenueDot.style.background = criticalCount > 0 ? 'var(--critical)' : 'var(--success)';
            }
        }

        // Display Content
        function displayContent(tabName) {
            if (tabName === 'top') {
                displayTopTasks();
            } else if (tabName === 'all') {
                displayAllTasks();
            } else if (tabName === 'categories') {
                displayCategories();
            }
        }

        function displayTopTasks() {
            const container = document.getElementById('topTasks');
            const topTasks = allTasks.slice(0, 5);
            
            if (topTasks.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-secondary); padding: 2rem;">No tasks loaded</div>';
                return;
            }

            container.innerHTML = `
                <div class="revenue-summary">
                    <h3>🔥 Top 5 Revenue Opportunities</h3>
                    <div class="summary-stats">
                        <div class="stat">
                            <div class="stat-value">${topTasks.filter(t => t.priority === 'Critical').length}</div>
                            <div class="stat-label">Critical</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${Math.round(topTasks.reduce((sum, t) => sum + t.scoring.score, 0) / topTasks.length)}</div>
                            <div class="stat-label">Avg Score</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${topTasks.filter(t => t.profit_potential === 'very_high').length}</div>
                            <div class="stat-label">High Profit</div>
                        </div>
                    </div>
                </div>
                ${topTasks.map(task => createTaskCard(task, true)).join('')}
            `;
        }

        function displayAllTasks() {
            const container = document.getElementById('allTasks');
            
            let filteredTasks = allTasks;
            if (currentFilter !== 'all') {
                filteredTasks = allTasks.filter(task => task.priority.toLowerCase() === currentFilter);
            }

            if (filteredTasks.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-secondary); padding: 2rem;">No tasks found</div>';
                return;
            }

            container.innerHTML = filteredTasks.map(task => createTaskCard(task, false)).join('');
        }

        function displayCategories() {
            const container = document.getElementById('categoryTasks');
            
            const categories = {};
            allTasks.forEach(task => {
                if (!categories[task.category]) {
                    categories[task.category] = [];
                }
                categories[task.category].push(task);
            });

            const categoryHtml = Object.entries(categories)
                .map(([category, tasks]) => {
                    const avgScore = Math.round(tasks.reduce((sum, t) => sum + t.scoring.score, 0) / tasks.length);
                    const topTask = tasks[0];

                    return `
                        <div class="revenue-summary">
                            <h3>${category}</h3>
                            <div class="summary-stats">
                                <div class="stat">
                                    <div class="stat-value">${tasks.length}</div>
                                    <div class="stat-label">Tasks</div>
                                </div>
                                <div class="stat">
                                    <div class="stat-value">${avgScore}</div>
                                    <div class="stat-label">Avg Score</div>
                                </div>
                                <div class="stat">
                                    <div class="stat-value">${tasks.filter(t => t.priority === 'Critical').length}</div>
                                    <div class="stat-label">Critical</div>
                                </div>
                            </div>
                        </div>
                        ${tasks.slice(0, 3).map(task => createTaskCard(task, false)).join('')}
                        ${tasks.length > 3 ? `<div style="text-align: center; color: var(--text-secondary); padding: 1rem;">... and ${tasks.length - 3} more</div>` : ''}
                    `;
                })
                .join('');

            container.innerHTML = categoryHtml || '<div style="text-align: center; color: var(--text-secondary); padding: 2rem;">No categories found</div>';
        }

        function createTaskCard(task, showPriority) {
            const priorityBadge = showPriority && task.priority === 'Critical' ? 
                `<div class="priority-badge">${task.priority}</div>` : '';

            return `
                <div class="revenue-task">
                    ${priorityBadge}
                    <div class="task-header">
                        <div class="task-title">${escapeHtml(task.title)}</div>
                        <div class="task-score">${task.scoring.score}</div>
                    </div>
                    <div class="task-category">${escapeHtml(task.category)}</div>
                    <div class="task-description">${escapeHtml(task.description)}</div>
                    <div class="task-meta">
                        <div class="task-tags">
                            <div class="task-tag tag-profit">${task.profit_potential.replace('_', ' ')}</div>
                            <div class="task-tag tag-time">${task.time_to_revenue}</div>
                            <div class="task-tag tag-complexity">${task.complexity}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Utility
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
