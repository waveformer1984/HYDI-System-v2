<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HYDI — Self-Diagnostic Proof</title>
<style>
  :root{--bg:#0a0e14;--panel:#11161f;--border:#232b38;--text:#dce3ec;--dim:#7d8896;--gold:#e3b341;--cyan:#39c5cf;--ok:#3fb950;--purple:#bc8cff;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Cascadia Code','Consolas',monospace;font-size:15px;}
  header{padding:16px 26px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;align-items:center;gap:14px;}
  .logo{width:38px;height:38px;border-radius:9px;background:var(--gold);color:#000;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;}
  h1{font-size:18px;margin:0;letter-spacing:1px;}
  .sub{color:var(--dim);font-size:13px;}
  main{max-width:1000px;margin:0 auto;padding:20px 26px 80px;}
  .step{border:1px solid var(--border);border-left:4px solid var(--dim);border-radius:10px;background:var(--panel);margin:14px 0;padding:14px 18px;opacity:.4;transition:opacity .3s;}
  .step.active{opacity:1;border-left-color:var(--gold);}
  .step.done{opacity:1;border-left-color:var(--ok);}
  .step h2{margin:0 0 4px;font-size:14px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;}
  .step.done h2{color:var(--ok);}
  .why{color:var(--dim);font-size:13px;margin-bottom:10px;}
  .io{margin:8px 0;padding:10px 12px;border-radius:8px;background:#0a0e14;border:1px solid var(--border);white-space:pre-wrap;line-height:1.5;}
  .io.q{border-left:3px solid var(--cyan);} .io.a{border-left:3px solid var(--gold);} .io.raw{border-left:3px solid var(--purple);font-size:12.5px;color:var(--dim);}
  .io .tag{font-size:11px;color:var(--dim);letter-spacing:1px;display:block;margin-bottom:4px;}
  .meta{color:var(--purple);font-size:12px;margin-top:6px;}
  .spin{color:var(--gold);} .verdict{font-weight:700;color:var(--ok);margin-top:8px;}
</style>
</head>
<body>
<header>
  <div class="logo">H</div>
  <div><h1>HYDI — SELF-DIAGNOSTIC PROOF</h1><div class="sub">Heidi measures herself, then answers from that measurement — not from guessing</div></div>
</header>
<main id="steps"></main>
<script>
const API='http://localhost:3456';
const steps=document.getElementById('steps');
function addStep(t,w){const d=document.createElement('div');d.className='step';d.innerHTML=`<h2>${t}</h2><div class="why">${w}</div><div class="body"></div>`;steps.appendChild(d);return d;}
function blk(s,cls,tag,txt){const b=document.createElement('div');b.className='io '+cls;b.innerHTML=`<span class="tag">${tag}</span>`;b.appendChild(document.createTextNode(txt));s.querySelector('.body').appendChild(b);window.scrollTo(0,document.body.scrollHeight);return b;}

async function askStream(step,q){
  blk(step,'q','ME → HEIDI',q);
  const a=blk(step,'a','HEIDI','');a.classList.add('spin');
  const t0=Date.now();let meta=null;
  try{
    const r=await fetch(API+'/think-stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input:q,options:{maxTokens:350}})});
    const reader=r.body.getReader();const dec=new TextDecoder();let buf='';
    while(true){const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});const evs=buf.split('\n\n');buf=evs.pop();
      for(const ev of evs){const line=ev.split('\n').find(l=>l.startsWith('data: '));if(!line)continue;
        try{const d=JSON.parse(line.slice(6));
          if(d.t){a.classList.remove('spin');a.childNodes[1].textContent+=d.t;window.scrollTo(0,document.body.scrollHeight);}
          if(d.done)meta=d;}catch{}}}
  }catch(e){a.childNodes[1].textContent='Error: '+e.message;}
  if(meta){const m=document.createElement('div');m.className='meta';m.textContent=`model ${meta.model} · ${((Date.now()-t0)/1000).toFixed(1)}s · confidence ${(meta.confidence??0).toFixed(2)} · memories retrieved: ${meta.memories_retrieved}`;a.appendChild(m);}
  return a.childNodes[1].textContent;
}

(async()=>{
  // Step 1: raw measurement
  let s=addStep('Step 1 · The ground truth','Pull Heidi\'s raw /diagnostics — the live numbers she must match.');s.classList.add('active');
  let diag;
  try{ diag=await(await fetch(API+'/diagnostics')).json();
    blk(s,'raw','GET /diagnostics',JSON.stringify(diag,null,2));
    s.classList.replace('active','done');
  }catch(e){blk(s,'raw','ERROR','Heidi Core unreachable at :3456 — run start-hydi-local.bat.');s.classList.replace('active','fail');return;}

  // Step 2: ask her conversationally
  s=addStep('Step 2 · Ask her, in plain English','Now ask Heidi to run diagnostics on herself. If she\'s truly grounded, her prose will match the JSON above — same model count, same fact count, same health.');s.classList.add('active');
  const ans=await askStream(s,'Run diagnostics on yourself and report: are you healthy, which model are you using, how many models are installed, how many facts are in your memory, and what ports do you run on?');
  s.classList.replace('active','done');

  // Step 3: automatic cross-check
  s=addStep('Step 3 · Cross-check','Programmatically confirm her spoken answer agrees with the measured truth.');s.classList.add('active');
  const facts=diag.memory?.fact_count, nModels=diag.brain?.models_available?.length, model=diag.brain?.model;
  const checks=[
    ['mentions healthy', /healthy|good|operational|online/i.test(ans) && diag.status==='healthy'],
    ['names model '+model, model && ans.toLowerCase().includes((model||'').toLowerCase())],
    ['fact count '+facts, facts!=null && new RegExp('\\b'+facts+'\\b').test(ans)],
    ['ports 3456/3006', /3456/.test(ans) && /3006/.test(ans)]
  ];
  checks.forEach(([n,ok])=>blk(s,'a',ok?'✔ MATCH':'△ CHECK',n));
  const hits=checks.filter(c=>c[1]).length;
  const v=document.createElement('div');v.className='verdict';
  v.textContent=`${hits}/4 grounded facts confirmed — Heidi answered from measurement, not memory of training data.`;
  s.querySelector('.body').appendChild(v);
  s.classList.replace('active','done');

  addStep('Evolution proven','Heidi now measures her own runtime and answers from it. She proposed this capability herself in the Evolution Council — and here it is, working.').classList.add('done');
})();
</script>
</body>
</html>
