name: Deploy Mobile Chat to GitHub Pages

# Local-only architecture decision (2026-07-10) set this to manual-only
# (workflow_dispatch) to avoid a second silent external-hosting path
# alongside Vercel. Re-enabled auto-publish-on-push (2026-07-15, explicit
# maintainer request) now that docs/index.html carries the mobile-ops Ops
# view (PR #190) and there's an actual reason to want it live automatically.
# workflow_dispatch stays available too for an on-demand redeploy.
#
# Auto-publish on push disabled (audit follow-up): nothing in the repo links to
# or depends on the GitHub Pages URL, and Pages itself needs owner enablement in
# repo Settings → Pages before this workflow can succeed. Manual dispatch only
# until the owner decides whether Pages is wanted at all.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          # Creates/enables GitHub Pages when the repo admin allows it; otherwise
          # the job still fails and NEEDS_FROM_JORDAN.md documents the UI toggle.
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
