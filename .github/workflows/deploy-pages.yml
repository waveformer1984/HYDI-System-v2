name: Deploy Mobile Chat to GitHub Pages

# Local-only architecture decision (2026-07-10): Hydi's mobile chat is
# reached via Tailscale (heidi-pc.tailc50af2.ts.net) now, so this no longer
# needs to auto-publish a public GitHub Pages site on every docs/ push --
# that was a second silent external-hosting path alongside Vercel. Trigger
# is manual-only; the capability stays available if ever needed again.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
