name: Deploy Mobile Chat to GitHub Pages

# Local-only architecture decision (2026-07-10) set this to manual-only
# (workflow_dispatch) to avoid a second silent external-hosting path
# alongside Vercel. Re-enabled auto-publish-on-push (2026-07-15, explicit
# maintainer request) now that docs/index.html carries the mobile-ops Ops
# view (PR #190) and there's an actual reason to want it live automatically.
# workflow_dispatch stays available too for an on-demand redeploy.
on:
  push:
    branches: [clean-main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
