name: HYDI Governance Gate

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.windsurf/workflows/hdi-governance-blueprint.md'
      - 'tests/hdi-adversarial.test.js'

jobs:
  governance-check:
    name: Governance Contract Validation
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: supabase/postgres:15.1.0.117
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hydi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      # Gate 1: Schema Change Detection
      - name: Detect Schema Changes
        id: schema-check
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD | grep -E '^supabase/migrations/.*\.sql$' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "schema_changed=true" >> $GITHUB_OUTPUT
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "⚠️  Schema changes detected:"
            echo "$CHANGED_FILES"
          else
            echo "schema_changed=false" >> $GITHUB_OUTPUT
            echo "✅ No schema changes"
          fi
      
      # Gate 2: Migration Transformer Tests
      - name: Require Migration Tests
        if: steps.schema-check.outputs.schema_changed == 'true'
        run: |
          MIGRATION_FILES="${{ steps.schema-check.outputs.files }}"
          
          for file in $MIGRATION_FILES; do
            VERSION=$(basename "$file" .sql)
            TEST_FILE="tests/migrations/${VERSION}.test.js"
            
            if [ ! -f "$TEST_FILE" ]; then
              echo "❌ Missing transformer test for migration: $VERSION"
              echo "   Expected: $TEST_FILE"
              echo ""
              echo "Every schema migration must include:"
              echo "  1. Up transformer test (old data → new schema)"
              echo "  2. Down transformer test (new data → old schema)"
              echo "  3. Replay safety verification"
              exit 1
            fi
            
            echo "✅ Transformer test found: $TEST_FILE"
          done
      
      # Gate 3: Enum/Transition Contract Validation
      - name: Validate State Machine Contract
        if: steps.schema-check.outputs.schema_changed == 'true'
        run: |
          # Check if hydi_allowed_transitions or enums were modified
          if git diff origin/main...HEAD | grep -E "(hydi_phase|hydi_status|hydi_allowed_transitions)" > /dev/null; then
            echo "🔒 State machine contract changes detected"
            
            # Require explicit approval in PR description
            PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} --json body -q .body)
            if ! echo "$PR_BODY" | grep -q "STATE_MACHINE_APPROVED"; then
              echo "❌ State machine changes require explicit approval"
              echo "   Add 'STATE_MACHINE_APPROVED' to PR description with justification:"
              echo "   - Impact on existing runs"
              echo "   - Migration strategy"
              echo "   - Rollback plan"
              exit 1
            fi
            
            echo "✅ State machine change approved"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Gate 4: Run Adversarial Tests
      - name: Setup Test Database
        if: steps.schema-check.outputs.schema_changed == 'true'
        run: |
          # Apply migrations to test database
          PGPASSWORD=postgres psql -h localhost -U postgres -d hydi_test -f supabase/migrations/00000000000000_initial_schema.sql
          
          # Apply new migrations
          for file in ${{ steps.schema-check.outputs.files }}; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d hydi_test -f "$file"
          done
      
      - name: Run Adversarial Tests
        if: steps.schema-check.outputs.schema_changed == 'true'
        run: |
          export SUPABASE_URL=http://localhost:54321
          export SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.test
          
          npm run test:adversarial
        env:
          NODE_ENV: test
      
      # Gate 5: Replay Fidelity Check
      - name: Verify Replay Fidelity
        if: steps.schema-check.outputs.schema_changed == 'true'
        run: |
          # Generate 10 sample runs
          node scripts/generate-sample-runs.js --count 10 --output sample-runs.json
          
          # Reconstruct each and compare hashes
          node scripts/verify-replay-fidelity.js --runs sample-runs.json
          
          echo "✅ Replay fidelity verified for all sample runs"
      
      # Gate 6: Performance Regression
      - name: Performance Regression Test
        if: steps.schema-check.outputs.schema_changed == 'true'
        run: |
          npm run test:performance -- --baseline performance-baseline.json
          
          # Check SLOs
          node scripts/check-slos.js --results performance-results.json
      
      # Gate 7: Documentation Sync
      - name: Require Blueprint Update
        if: steps.schema-check.outputs.schema_changed == 'true'
        run: |
          # Check if blueprint was updated
          if ! git diff --name-only origin/main...HEAD | grep -q ".windsurf/workflows/hdi-governance-blueprint.md"; then
            echo "❌ Schema changes require blueprint update"
            echo "   Update .windsurf/workflows/hdi-governance-blueprint.md to reflect:"
            echo "   - New tables/columns"
            echo "   - Modified transitions"
            echo "   - Changed RLS policies"
            exit 1
          fi
          
          echo "✅ Blueprint updated"
      
      # Final Summary
      - name: Governance Gate Summary
        if: always()
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "   HYDI Governance Gate Results"
          echo "═══════════════════════════════════════════════════"
          echo "Schema Changes: ${{ steps.schema-check.outputs.schema_changed }}"
          echo ""
          echo "All governance checks passed. Ready for merge."

  # Post-merge: Update frozen contracts
  update-contracts:
    name: Update Frozen Contracts
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: governance-check
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Update Governance Contract
        run: |
          # Generate frozen contract snapshot
          node scripts/generate-contract-snapshot.js \
            --output .windsurf/workflows/hdi-governance-contract.json
          
          # Update schema hash
          node scripts/update-schema-hash.js
          
          # Commit if changed
          git config user.name "HYDI Governance Bot"
          git config user.email "governance@protoforge.hydi"
          
          git add .windsurf/workflows/hdi-governance-contract.json
          git add supabase/migrations/schema-hash.txt
          
          if git diff --cached --quiet; then
            echo "No contract changes to commit"
          else
            git commit -m "chore(governance): Update frozen contract [skip ci]"
            git push
          fi
