name: HYDI Governance Gate

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.windsurf/workflows/hdi-governance-blueprint.md'
      - 'tests/hdi-adversarial.test.js'
      - 'scripts/preflight.js'
      - 'scripts/scan-live-secrets.js'
      - 'scripts/lint-migration-idempotency.js'
      - 'scripts/watchdog.js'
      - 'ecosystem.config.js'
  push:
    branches:
      - clean-main
    paths:
      - 'supabase/migrations/**'
      - '.windsurf/workflows/hdi-governance-blueprint.md'
      - 'tests/hdi-adversarial.test.js'
      - 'scripts/preflight.js'
      - 'scripts/scan-live-secrets.js'
      - 'scripts/lint-migration-idempotency.js'
      - 'scripts/watchdog.js'
      - 'ecosystem.config.js'

jobs:
  governance-check:
    name: Governance Contract Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # Gate 1: Schema Change Detection
      - name: Detect Schema Changes
        id: schema-check
        run: |
          CHANGED_FILES=$(git diff --name-only origin/clean-main...HEAD | grep -E '^supabase/migrations/.*\.sql$' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "schema_changed=true" >> $GITHUB_OUTPUT
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "⚠️  Schema changes detected:"
            echo "$CHANGED_FILES"
          else
            echo "schema_changed=false" >> $GITHUB_OUTPUT
            echo "✅ No schema changes"
          fi
      
      # Gate 2: Migration Transformer Tests
      - name: Require Migration Tests
        if: steps.schema-check.outputs.schema_changed == 'true'
        run: |
          MIGRATION_FILES="${{ steps.schema-check.outputs.files }}"
          
          for file in $MIGRATION_FILES; do
            VERSION=$(basename "$file" .sql)
            TEST_FILE="tests/migrations/${VERSION}.test.js"
            
            if [ ! -f "$TEST_FILE" ]; then
              echo "❌ Missing transformer test for migration: $VERSION"
              echo "   Expected: $TEST_FILE"
              echo ""
              echo "Every schema migration must include:"
              echo "  1. Up transformer test (old data → new schema)"
              echo "  2. Down transformer test (new data → old schema)"
              echo "  3. Replay safety verification"
              exit 1
            fi
            
            echo "✅ Transformer test found: $TEST_FILE"
          done
      
      # Gate 2b: Migration Idempotency Lint (ratchet — fails on NEW violations only)
      - name: Migration Idempotency Lint (ratchet)
        if: steps.schema-check.outputs.schema_changed == 'true'
        run: |
          # Use ratchet mode: existing violations are captured in the baseline
          # (supabase/migration-lint-baseline.json). Only NEW violations fail.
          # To lint only changed files, pass them as args; otherwise lint all.
          MIGRATION_FILES="${{ steps.schema-check.outputs.files }}"
          FILES_TO_LINT=""
          for file in $MIGRATION_FILES; do
            # Only lint .sql files in supabase/migrations/
            case "$file" in
              supabase/migrations/*.sql)
                FILES_TO_LINT="$FILES_TO_LINT $file"
                ;;
            esac
          done
          if [ -n "$FILES_TO_LINT" ]; then
            # Lint changed files in ratchet mode — fails if any violation is NOT in baseline
            node scripts/lint-migration-idempotency.js --ratchet $FILES_TO_LINT
          else
            echo "No changed migration files to lint"
          fi

      # Gate 2c: Live Secret Scan (always runs on every PR)
      - name: Live Secret Scan
        run: node scripts/scan-live-secrets.js

      # Gate 3: Enum/Transition Contract Validation
      - name: Validate State Machine Contract
        if: steps.schema-check.outputs.schema_changed == 'true'
        run: |
          # Check if hydi_allowed_transitions or enums were modified
          # Grep only migration SQL — a test asserting "no state-machine
          # change" legitimately contains these strings and must not trip
          # the approval requirement.
          if git diff origin/clean-main...HEAD -- 'supabase/migrations/*.sql' | grep -E "(hydi_phase|hydi_status|hydi_allowed_transitions)" > /dev/null; then
            echo "🔒 State machine contract changes detected"
            
            # Require explicit approval in PR description
            PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} --json body -q .body)
            if ! echo "$PR_BODY" | grep -q "STATE_MACHINE_APPROVED"; then
              echo "❌ State machine changes require explicit approval"
              echo "   Add 'STATE_MACHINE_APPROVED' to PR description with justification:"
              echo "   - Impact on existing runs"
              echo "   - Migration strategy"
              echo "   - Rollback plan"
              exit 1
            fi
            
            echo "✅ State machine change approved"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Gate 4: Run Adversarial Tests
      - name: Setup Test Database
        if: steps.schema-check.outputs.schema_changed == 'true'
        run: |
          # A bare supabase/postgres container cannot host this schema:
          # migrations rely on platform-provided objects (auth.jwt(), pg_cron
          # bound to the postgres DB) that only the real stack creates. The
          # honest test database is `supabase start` itself — its own
          # migration runner applies every supabase/migrations/*.sql file,
          # the same path production deploys take. Same recipe as
          # unit-tests.yml.
          npx supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env"
          api_url=$(grep '^API_URL=' "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')
          service_key=$(grep '^SERVICE_ROLE_KEY=' "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')
          rm -f "$RUNNER_TEMP/supabase.env"
          echo "::add-mask::$service_key"
          {
            echo "SUPABASE_URL=$api_url"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service_key"
          } >> "$GITHUB_ENV"
      
      - name: Run Adversarial Tests
        if: steps.schema-check.outputs.schema_changed == 'true'
        run: |
          npm run test:integration
        env:
          NODE_ENV: test

      # Gate 4b: Verify Supabase schema (table existence + RLS checks)
      # against the Postgres service container, mirroring verify-supabase.sh
      - name: Verify Supabase Schema
        if: steps.schema-check.outputs.schema_changed == 'true'
        run: |
          # Check that all core tables exist and have RLS enabled.
          # `ledger` was renamed to `financial_ledger` (20260723000001) — the
          # `ledger` name is now a compatibility view, which can never carry
          # relrowsecurity. Both queries pin table_schema/relnamespace to
          # 'public' so Supabase platform tables (e.g. auth.sessions) cannot
          # collide with same-named public tables.
          CORE_TABLES="memories actions sessions financial_ledger clients payouts webhook_events leads quotes proposals checkout_sessions"
          FAIL=0
          for tbl in $CORE_TABLES; do
            EXISTS=$(PGPASSWORD=postgres psql -tA -h localhost -p 54322 -U postgres -d postgres -c "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_schema='public' AND table_name='$tbl')" 2>/dev/null)
            if [ "$EXISTS" != "t" ]; then
              echo "❌ Missing table: $tbl"
              FAIL=1
            else
              RLS=$(PGPASSWORD=postgres psql -tA -h localhost -p 54322 -U postgres -d postgres -c "SELECT c.relrowsecurity FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname='public' AND c.relname='$tbl'" 2>/dev/null)
              if [ "$RLS" != "t" ]; then
                echo "❌ RLS not enabled on: $tbl"
                FAIL=1
              else
                echo "✅ $tbl exists with RLS enabled"
              fi
            fi
          done
          if [ $FAIL -ne 0 ]; then
            exit 1
          fi
      
      # Gate 5: Replay Fidelity Check
      - name: Verify Replay Fidelity
        if: steps.schema-check.outputs.schema_changed == 'true'
        run: |
          # The generate/verify scripts this step referenced were never
          # written; the real replay-fidelity coverage is the pipeline
          # replay suite.
          npm run test:replay
          echo "✅ Replay fidelity verified"
      
      # Gate 6: Performance Regression
      - name: Performance Regression Test
        if: steps.schema-check.outputs.schema_changed == 'true'
        run: |
          # Real regression gate: runs the phase-36 stability probe and exits
          # nonzero when any check regresses past its recorded baseline.
          node scripts/phase37-performance-regression.js
      
      # Gate 7: Documentation Sync
      - name: Require Blueprint Update
        if: steps.schema-check.outputs.schema_changed == 'true'
        run: |
          # Check if blueprint was updated
          if ! git diff --name-only origin/clean-main...HEAD | grep -q ".windsurf/workflows/hdi-governance-blueprint.md"; then
            echo "❌ Schema changes require blueprint update"
            echo "   Update .windsurf/workflows/hdi-governance-blueprint.md to reflect:"
            echo "   - New tables/columns"
            echo "   - Modified transitions"
            echo "   - Changed RLS policies"
            exit 1
          fi
          
          echo "✅ Blueprint updated"
      
      # Final Summary
      - name: Governance Gate Summary
        if: always()
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "   HYDI Governance Gate Results"
          echo "═══════════════════════════════════════════════════"
          echo "Schema Changes: ${{ steps.schema-check.outputs.schema_changed }}"
          echo ""
          echo "All governance checks passed. Ready for merge."

  # NOTE: a post-merge "Update Frozen Contracts" job used to live here, but it
  # invoked scripts/generate-contract-snapshot.js and scripts/update-schema-hash.js
  # — neither ever existed, and hdi-governance-contract.json is an authored
  # artifact (agent boundaries, SLOs, signatures) that cannot be regenerated
  # from migrations. The dead job was removed rather than replaced with a
  # generator that would clobber authored governance content.
