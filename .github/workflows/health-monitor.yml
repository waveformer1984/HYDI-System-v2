name: Health Monitor

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Check for stuck Actions runs
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "🔍 Checking for Actions runs stuck in 'queued' (e.g. an offline self-hosted runner — see issue #195)"
        THRESHOLD_MINUTES=15
        NOW=$(date -u +%s)
        STUCK=0
        for run_id in $(gh api "repos/${{ github.repository }}/actions/runs?status=queued&per_page=50" --jq '.workflow_runs[].id'); do
          CREATED=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq '.created_at')
          CREATED_TS=$(date -u -d "$CREATED" +%s)
          AGE_MIN=$(( (NOW - CREATED_TS) / 60 ))
          if [ "$AGE_MIN" -ge "$THRESHOLD_MINUTES" ]; then
            echo "❌ Run $run_id has been queued for ${AGE_MIN}m (threshold ${THRESHOLD_MINUTES}m): ${{ github.server_url }}/${{ github.repository }}/actions/runs/$run_id"
            STUCK=1
          fi
        done
        if [ "$STUCK" -eq 1 ]; then
          echo "One or more Actions runs are stuck in 'queued' — likely no runner is picking up jobs."
          exit 1
        fi
        echo "✅ No stuck queued runs"

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '18'

    - name: Run health check
      run: |
        echo "🏥 Running scheduled health check"
        node test-critical-path.js

    - name: Check Vercel environment
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        echo "🔍 Checking Vercel environment"
        node vercel-api-check.js

    - name: Tripwire detection
      run: |
        echo "⚠️  Running tripwire detection"
        # This would need to be adapted for CI environment

    - name: Alert on failure (open/update tracking issue)
      if: failure()
      uses: actions/github-script@v9
      with:
        script: |
          const title = 'HYDI health check failing';
          const label = 'health-alert';
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          const { data: existing } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: label,
          });

          const body = `Scheduled health-monitor run failed at ${new Date().toISOString()}.\n\nRun: ${runUrl}`;

          if (existing.length > 0) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing[0].number,
              body,
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [label],
            });
          }

  critical-alert:
    runs-on: ubuntu-latest
    needs: health-check
    if: failure()
    permissions:
      contents: read
      issues: write

    steps:
    - name: Escalate tracking issue
      uses: actions/github-script@v9
      with:
        script: |
          const label = 'health-alert';
          const { data: existing } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: label,
          });

          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const body = `💀 CRITICAL: health-check job failed at ${new Date().toISOString()}. Immediate attention required.\n\nRun: ${runUrl}`;

          if (existing.length > 0) {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing[0].number,
              labels: [label, 'critical'],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing[0].number,
              body,
            });
          }
