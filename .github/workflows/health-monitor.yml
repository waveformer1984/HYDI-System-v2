name: Health Monitor

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '18'

    - name: Run health check
      run: |
        echo "🏥 Running scheduled health check"
        node test-critical-path.js

    - name: Check Vercel environment
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        echo "🔍 Checking Vercel environment"
        node vercel-api-check.js

    - name: Tripwire detection
      run: |
        echo "⚠️  Running tripwire detection"
        # This would need to be adapted for CI environment

    - name: Alert on failure (open/update tracking issue)
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const title = 'HYDI health check failing';
          const label = 'health-alert';
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          const { data: existing } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: label,
          });

          const body = `Scheduled health-monitor run failed at ${new Date().toISOString()}.\n\nRun: ${runUrl}`;

          if (existing.length > 0) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing[0].number,
              body,
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [label],
            });
          }

  critical-alert:
    runs-on: self-hosted
    needs: health-check
    if: failure()
    permissions:
      contents: read
      issues: write

    steps:
    - name: Escalate tracking issue
      uses: actions/github-script@v7
      with:
        script: |
          const label = 'health-alert';
          const { data: existing } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: label,
          });

          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const body = `💀 CRITICAL: health-check job failed at ${new Date().toISOString()}. Immediate attention required.\n\nRun: ${runUrl}`;

          if (existing.length > 0) {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing[0].number,
              labels: [label, 'critical'],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing[0].number,
              body,
            });
          }
