name: Health Monitor

on:
  schedule:
    # Hourly. GitHub throttles 5-minute schedules to every few hours anyway,
    # and a tighter cadence only adds noise to the tracking issue.
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Check for stuck Actions runs
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "🔍 Checking for Actions runs stuck in 'queued' (e.g. an offline self-hosted runner — see issue #195)"
        THRESHOLD_MINUTES=15
        # A run queued longer than this is an abandoned ghost (GitHub normally
        # expires queued jobs within 24h). One such ghost from 2026-08-10 kept
        # this check red on every run and buried real failures in #337.
        # Ghosts are reported as warnings; cancel them by hand.
        ABANDONED_MINUTES=1440
        NOW=$(date -u +%s)
        STUCK=0
        for run_id in $(gh api "repos/${{ github.repository }}/actions/runs?status=queued&per_page=50" --jq '.workflow_runs[].id'); do
          CREATED=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq '.created_at')
          CREATED_TS=$(date -u -d "$CREATED" +%s)
          AGE_MIN=$(( (NOW - CREATED_TS) / 60 ))
          if [ "$AGE_MIN" -ge "$ABANDONED_MINUTES" ]; then
            echo "::warning::Run $run_id has been queued for ${AGE_MIN}m and looks abandoned; cancel it: ${{ github.server_url }}/${{ github.repository }}/actions/runs/$run_id"
            continue
          fi
          if [ "$AGE_MIN" -ge "$THRESHOLD_MINUTES" ]; then
            echo "❌ Run $run_id has been queued for ${AGE_MIN}m (threshold ${THRESHOLD_MINUTES}m): ${{ github.server_url }}/${{ github.repository }}/actions/runs/$run_id"
            STUCK=1
          fi
        done
        if [ "$STUCK" -eq 1 ]; then
          echo "One or more Actions runs are stuck in 'queued' — likely no runner is picking up jobs."
          exit 1
        fi
        echo "✅ No stuck queued runs"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Run health check
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        echo "🏥 Running scheduled health check"
        if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
          echo "::notice::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY repo secrets not set; skipping DB check (Frank's /api/health is the live monitor)"
          exit 0
        fi
        npm install --no-save --no-audit --no-fund --ignore-scripts dotenv @supabase/supabase-js
        node test-critical-path.js

    # Retired once Cloudflare cutover is verified: set repo variable
    # VERCEL_RETIRED=true (Settings → Secrets and variables → Actions →
    # Variables) and this step skips instead of failing on a dead account.
    - name: Check Vercel environment
      if: vars.VERCEL_RETIRED != 'true'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        echo "🔍 Checking Vercel environment"
        if [ -z "$VERCEL_TOKEN" ]; then
          echo "::notice::VERCEL_TOKEN repo secret not set; skipping Vercel env check"
          exit 0
        fi
        node vercel-api-check.js

    - name: Tripwire detection
      run: |
        echo "⚠️  Running tripwire detection"
        # This would need to be adapted for CI environment

    - name: Alert on failure (open/update tracking issue)
      if: failure()
      uses: actions/github-script@v9
      with:
        script: |
          const title = 'HYDI health check failing';
          const label = 'health-alert';
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          const { data: existing } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: label,
          });

          const body = `Scheduled health-monitor run failed at ${new Date().toISOString()}.\n\nRun: ${runUrl}`;

          if (existing.length > 0) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing[0].number,
              body,
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [label],
            });
          }

  critical-alert:
    runs-on: ubuntu-latest
    needs: health-check
    if: failure()
    permissions:
      contents: read
      issues: write

    steps:
    - name: Escalate tracking issue
      uses: actions/github-script@v9
      with:
        script: |
          const label = 'health-alert';
          const { data: existing } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: label,
          });

          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const body = `💀 CRITICAL: health-check job failed at ${new Date().toISOString()}. Immediate attention required.\n\nRun: ${runUrl}`;

          if (existing.length > 0) {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing[0].number,
              labels: [label, 'critical'],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing[0].number,
              body,
            });
          }
