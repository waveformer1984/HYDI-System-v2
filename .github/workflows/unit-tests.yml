name: Unit Tests

on:
  push:
    branches: [clean-main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Jest Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # tests/migrations/** and the DB-backed tests/unit suites (communication
      # layer, revenue engine, cognitive core, *-qualification) run against a
      # local Supabase: PostgREST on :54321, Postgres on :54322, with every
      # migration and supabase/seed.sql applied. Start one with the CLI pinned
      # in package.json and export its URL and keys, which are the CLI's fixed
      # local-development defaults, not project secrets.
      - name: Start local Supabase
        run: |
          npx supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env"
          api_url=$(grep '^API_URL=' "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')
          service_key=$(grep '^SERVICE_ROLE_KEY=' "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')
          anon_key=$(grep '^ANON_KEY=' "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')
          rm -f "$RUNNER_TEMP/supabase.env"
          echo "::add-mask::$service_key"
          echo "::add-mask::$anon_key"
          {
            echo "SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service_key"
            echo "SUPABASE_ANON_KEY=$anon_key"
          } >> "$GITHUB_ENV"

      - name: Run unit tests with coverage
        run: npm test -- --coverage --forceExit

      - name: Upload coverage report (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: unit
          fail_ci_if_error: false
