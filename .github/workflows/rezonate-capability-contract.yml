name: Rezonate Capability Contract

# P1 #7 (docs/REZONATE_CONSOLIDATION_PLAN.md): CI enforcement of the capability
# contract, so a status claim (e.g. RezonetteModule.tsx displaying "complete") can
# never silently drift from capability-contract.json again — this is the guard
# against a repeat of the original P0.1 bug. Also runs the canonical Rezonate app's
# own test suite, since it's what backs every non-PLANNED state in the contract and
# was not previously wired into any CI workflow (root jest config only matches
# tests/unit/**, and protoforge-applications/rezonate/tests/*.test.js uses node:test).

on:
  push:
    branches: [clean-main]
    paths:
      - 'protoforge-applications/rezonate/**'
      - 'apps/ursula-frontend/src/components/modules/RezonetteModule.tsx'
      - 'scripts/validate-rezonate-capability-contract.js'
      - '.github/workflows/rezonate-capability-contract.yml'
  pull_request:
    paths:
      - 'protoforge-applications/rezonate/**'
      - 'apps/ursula-frontend/src/components/modules/RezonetteModule.tsx'
      - 'scripts/validate-rezonate-capability-contract.js'
      - '.github/workflows/rezonate-capability-contract.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-guard:
    name: Validate capability contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate capability-contract.json + scan for hardcoded status drift
        run: npm run validate:rezonate-contract

  rezonate-tests:
    name: Rezonate app test suite (node:test)
    runs-on: ubuntu-latest
    # Informational, not blocking. True known-failure list after the 2026-10-23
    # triage: none expected on Linux CI — previously this job only ran the ROOT
    # npm ci, so app-local deps (cors, ethers, express, ganache, solc) were
    # missing and ~8 api/nft/ownership tests failed, and the segmentation suite
    # failed on missing python modules. Both install steps are now explicit.
    # On Windows, tests/api.test.js temp cleanup could EPERM against sendFile's
    # open handle — now rmSync retries; segment-swap tests honestly skip when
    # python + numpy/soundfile/librosa are absent. continue-on-error stays while
    # the job's green rate is verified — if the failure count changes, look.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python (segment-swap engine tests)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python audio deps
        run: python -m pip install numpy soundfile librosa

      - name: Install root dependencies
        run: npm ci

      # package-lock.json is deliberately gitignored for this app —
      # install resolves against its package.json (same as local dev).
      - name: Install Rezonate app dependencies
        working-directory: protoforge-applications/rezonate
        run: npm install

      - name: Run Rezonate test suite
        working-directory: protoforge-applications/rezonate
        run: node --test tests/*.test.js
