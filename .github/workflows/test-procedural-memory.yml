name: Test Procedural Memory

on:
  workflow_dispatch:
  push:
    paths:
      - "eval-procedural-memory.js"
      - "heidi-procedural-memory.js"
      - ".github/workflows/test-procedural-memory.yml"

jobs:
  procedural-memory:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Run procedural-memory eval
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node eval-procedural-memory.js
