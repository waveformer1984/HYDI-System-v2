name: Deploy Ursula to Cloudflare

# Manual deploy for apps/ursula-frontend → Cloudflare Workers (OpenNext).
# workflow_dispatch only — nothing auto-deploys. Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN   (API token with Workers edit permission)
#   CLOUDFLARE_ACCOUNT_ID  (dashboard URL: dash.cloudflare.com/<account-id>)
# Without them the run exits green with a notice — see docs/VERCEL_EXIT_PLAN.md.

on:
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-ursula
  cancel-in-progress: false

jobs:
  deploy:
    name: Build OpenNext bundle + wrangler deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/ursula-frontend

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Guard — Cloudflare secrets configured?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets not set; deploy skipped. Add them under Settings → Secrets and variables → Actions (docs/VERCEL_EXIT_PLAN.md §6)."
            exit 0
          fi
          echo "Cloudflare secrets present; proceeding with deploy"

      - name: Setup Node.js
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/ursula-frontend/package-lock.json

      - name: Install dependencies
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm ci

      - name: Build OpenNext bundle
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run build:cf

      - name: Deploy worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy
